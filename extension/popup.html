<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{width:240px;padding:12px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:12px;background:#0f172a;color:#e2e8f0;margin:0}
h2{font-size:14px;margin:0 0 8px;color:#34d399}
.status{font-size:10px;color:#94a3b8;margin-bottom:8px}
.status b{color:#22c55e}
.btn{width:100%;padding:8px;border:none;border-radius:4px;cursor:pointer;font-size:12px;margin-bottom:6px;color:white}
.btn-record{background:#ef4444}
.btn-inject{background:#2563eb}
.btn-reset{background:#475569;font-size:10px}
.endpoint{margin-top:8px;font-size:9px;color:#64748b}
.endpoint input{width:100%;padding:4px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:3px;font-size:10px;margin-top:2px}
</style>
</head>
<body>
<h2>Ultrasound Voice AI</h2>
<div class="status">API: <b id="apiStatus">checking...</b></div>
<button class="btn btn-record" id="recordBtn">Record</button>
<button class="btn btn-inject" id="injectBtn">Inject to PACS</button>
<button class="btn btn-reset" id="resetBtn">Reset</button>
<div class="endpoint">
  API Endpoint
  <input id="apiUrl" value="http://localhost:8800" placeholder="http://localhost:8800">
</div>
<script src="popup.js"></script>
</body>
</html>
