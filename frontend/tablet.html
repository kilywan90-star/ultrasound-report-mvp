<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平板听写模式 - 超声报告</title>
<style>
:root{--bg:#eef5ff;--card:#fff;--primary:#1a73e8;--primary2:#1557b0;--text:#172033;--muted:#64748b;--border:#dbe7f6;--green:#0d9488;--orange:#f59e0b;--red:#dc2626;--shadow:0 4px 18px rgba(15,23,42,.08);--radius:18px;--font:'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.tablet{height:100vh;display:grid;grid-template-rows:72px 1fr 76px;gap:12px;padding:14px}
.header{background:linear-gradient(135deg,#0f4ea8,#1a73e8);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header h1{font-size:24px;font-weight:700}.patient{font-size:18px;opacity:.95}.session{font-size:14px;opacity:.8;text-align:right}
.main{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;min-height:0}.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}.panel-hd{padding:14px 18px;border-bottom:1px solid var(--border);font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.panel-bd{padding:16px 18px;overflow:auto;flex:1}.patient-cards{display:flex;gap:12px;margin-bottom:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.patient-card{flex:0 0 260px;scroll-snap-align:start;border:2px solid var(--border);background:linear-gradient(180deg,#fff,#f8fbff);border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 2px 10px rgba(15,23,42,.06);transition:.15s;min-height:112px}.patient-card:hover{border-color:var(--primary);transform:translateY(-1px)}.patient-card.on{border-color:var(--primary);box-shadow:0 0 0 4px rgba(26,115,232,.12)}.pc-name{font-size:28px;font-weight:900;margin-bottom:4px}.pc-meta{font-size:15px;color:var(--muted);line-height:1.55}.pc-tag{display:inline-block;margin-top:6px;font-size:12px;color:#047857;background:#ecfdf5;border-radius:999px;padding:2px 8px}
.recognized{font-size:30px;line-height:1.7;letter-spacing:.5px}.recognized .interim{color:var(--muted)}.recognized .final{color:var(--text)}.final-box{margin-top:14px;background:#f8fbff;border:1px dashed var(--border);border-radius:14px;padding:14px;font-size:18px;line-height:1.7;color:#334155;max-height:180px;overflow:auto;white-space:pre-wrap}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}.kpi-card{background:#f8fbff;border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}.kpi-card label{display:block;font-size:13px;color:var(--muted)}.kpi-card div{font-size:20px;font-weight:700;margin-top:5px}.report-block{margin-top:12px}.report-block h3{font-size:15px;color:var(--primary);margin-bottom:6px}.report-text{background:#f8fbff;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:18px;line-height:1.65;white-space:pre-wrap;min-height:76px}.source{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-all}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls{display:flex;gap:12px}.btn-primary,.btn-danger,.btn-outline,.btn-success{border:none;border-radius:18px;padding:16px 28px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);font-family:var(--font)}.btn-primary{background:var(--primary);color:#fff}.btn-danger{background:var(--red);color:#fff}.btn-success{background:var(--green);color:#fff}.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--border)}button:disabled{opacity:.45;cursor:not-allowed}.status-msg{font-size:18px;color:var(--muted);padding:12px 18px;background:#fff;border-radius:18px;box-shadow:var(--shadow)}.status-listening{color:var(--green)}.status-error{color:var(--red)}select{font-size:18px;padding:12px 16px;border-radius:14px;border:1px solid var(--border);min-width:360px;background:#fff;color:var(--text)}.warn{display:none;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:8px}.alert-success{background:#ecfdf5;border:1px solid #99f6e4;color:#047857;border-radius:12px;padding:10px 12px;margin-top:10px}.small{font-size:13px;color:var(--muted)}
@media(max-width:900px){.main{grid-template-columns:1fr}.tablet{overflow:auto;height:auto}.recognized{font-size:24px}.btn-primary,.btn-danger,.btn-outline,.btn-success{font-size:16px;padding:12px 18px}select{min-width:220px;width:100%}}
</style>
</head>
<body>
<div class="tablet">
  <div class="header">
    <div>
      <h1>平板实时听写模式</h1>
      <div class="patient">患者：<span id="patientInfo">未选择</span></div>
      <div id="httpsWarn" class="warn">当前不是安全上下文，浏览器可能禁止麦克风。请使用 https://47.109.151.238/tablet.html</div>
    </div>
    <div class="session">
      <div>超声主任旁屏</div>
      <div id="sessionStatus">请选择患者</div>
    </div>
  </div>

  <div class="main">
    <section class="panel">
      <div class="panel-hd">
        <span>患者队列 / 实时识别</span>
        <select id="patientSelect" style="display:none"><option>加载患者队列...</option></select>
      </div>
      <div class="panel-bd">
        <div id="patientCards" class="patient-cards">加载患者队列...</div>
        <div id="recognizedText" class="recognized">等待语音输入...</div>
        <div class="final-box"><div class="small">已确认文本</div><div id="finalOnly">(等待语音输入)</div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-hd">实时理解 / 报告草稿</div>
      <div class="panel-bd">
        <div class="kpi">
          <div class="kpi-card"><label>部位</label><div id="previewSite">-</div></div>
          <div class="kpi-card"><label>模板</label><div id="previewTemplate">-</div></div>
          <div class="kpi-card"><label>置信度</label><div id="previewConfidence">--</div></div>
        </div>
        <div class="report-block"><h3>超声所见</h3><div id="previewSee" class="report-text">-</div></div>
        <div class="report-block"><h3>超声提示</h3><div id="previewHint" class="report-text">-</div></div>
        <div class="report-block"><h3>建议</h3><div id="previewRec" class="report-text">-</div></div>
        <div class="report-block"><h3>ASR原文</h3><div id="previewSource" class="source">-</div></div>
        <div id="confirmResult"></div>
      </div>
    </section>
  </div>

  <div class="footer">
    <div class="controls">
      <button id="listenBtn" class="btn-primary" disabled>🎤 开始监听</button>
      <button id="confirmBtn" class="btn-success">✅ 确认生成报告</button>
      <button id="clearBtn" class="btn-outline" disabled>清空重说</button>
    </div>
    <div id="statusMsg" class="status-msg">准备就绪</div>
  </div>
</div>
<script src="/tablet.js?v=20260609"></script>
</body>
</html>
