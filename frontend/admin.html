<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 — 超声报告语音结构化 API</title>
<style>
:root{--nav-bg:#0f172a;--nav-text:#94a3b8;--bg:#f1f5f9;--card-bg:#fff;--text:#1e293b;--text-muted:#64748b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06);--green:#059669;--blue:#3b82f6;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
nav{background:var(--nav-bg);padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
nav .brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
nav .brand span{font-size:10px;color:var(--nav-text);font-weight:400;margin-left:6px}
nav a{font-size:13px;color:var(--nav-text);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:6px;transition:all .15s}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav a.active{color:#fff;background:var(--green)}
main{max-width:1300px;margin:24px auto;padding:0 20px}
.summary{display:flex;gap:14px;margin-bottom:20px}
.summary .box{flex:1;background:var(--card-bg);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow)}
.summary .box .num{font-size:28px;font-weight:800;color:#1e40af}
.summary .box .label2{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:500}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:'';width:4px;height:14px;background:var(--green);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;background:#f8fafc;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:2px solid #e2e8f0}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-free{background:#e2e8f0;color:#475569}.badge-basic{background:#dcfce7;color:#16a34a}.badge-pro{background:#fef3c7;color:#d97706}
.btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:3px 8px;font-size:10px}
select.plan-select{padding:4px 6px;border:1px solid #d1d5db;border-radius:5px;font-size:11px}
</style>
</head>
<body>

<nav>
  <div class="brand">UltraSonic AI<span>v4.2</span></div>
  <a href="/">工作站</a>
  <a href="/developer.html">开发者</a>
  <a href="/plans.html">套餐</a>
  <a href="/admin.html" class="active">管理</a>
  <a href="/dashboard.html">看板</a>
  <a href="/trace_logs.html">日志</a>
  <a href="/error_report.html">纠错</a>
</nav>

<main>
  <div class="summary">
    <div class="box"><div class="num" id="totalTenants">0</div><div class="label2">租户数</div></div>
    <div class="box"><div class="num" id="totalCalls">0</div><div class="label2">本月调用</div></div>
    <div class="box"><div class="num" id="totalBilled">¥0</div><div class="label2">本月收入</div></div>
  </div>

  <div class="card">
    <h2>租户列表 <button class="btn btn-primary btn-sm" onclick="showCreate()" style="float:right">+ 新建租户</button></h2>
    <table id="tenantTable"><tr><th>ID</th><th>名称</th><th>套餐</th><th>API Key</th><th>调用</th><th>费用</th><th>状态</th><th>操作</th></tr></table>
  </div>
  <div class="card"><h2>注册记录</h2><table id="regTable"><tr><th>时间</th><th>名称</th><th>邮箱</th><th>联系人</th><th>IP</th></tr></table></div>
  <div class="card"><h2>订单记录</h2><table id="orderTable"><tr><th>时间</th><th>租户</th><th>升级前</th><th>升级后</th><th>金额</th><th>状态</th></tr></table></div>
  <div class="card"><h2>音频文件</h2><table id="audioTable"><tr><th>时间</th><th>租户</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr></table></div>

  <div class="modal" id="createModal"><div>
    <h3>新建租户</h3>
    <label>名称</label><input id="createName"><label>邮箱</label><input id="createEmail"><label>套餐</label>
    <select id="createPlan"><option value="free">免费版</option><option value="basic">基础版</option><option value="pro">专业版</option></select>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" onclick="doCreate()">创建</button><button class="btn" style="background:#e2e8f0" onclick="document.getElementById('createModal').classList.remove('show')">取消</button></div>
  </div></div>
</main>

<script>
const BASE='http://47.109.151.238:80';
async function loadAdmin(){
  try{
    const r=await fetch(BASE+'/api/admin/usage');const d=await r.json();
    document.getElementById('totalTenants').textContent=d.summary.total_tenants;
    document.getElementById('totalCalls').textContent=d.summary.total_calls;
    document.getElementById('totalBilled').textContent='¥'+d.summary.total_billed.toFixed(0);
    const tr=await fetch(BASE+'/api/admin/tenants');const td=await tr.json();
    document.getElementById('tenantTable').innerHTML='<tr><th>ID</th><th>名称</th><th>套餐</th><th>API Key</th><th>调用</th><th>费用</th><th>状态</th><th>操作</th></tr>';
    td.tenants.forEach(t=>{
      const u=t.monthly_usage||{},badge='badge-'+(t.plan||'free');
      document.getElementById('tenantTable').innerHTML+=`<tr><td>${t.id}</td><td><b>${t.name}</b></td><td><span class="badge ${badge}">${t.plan}</span></td><td style="font-family:monospace;font-size:10px">${(t.api_key||'').slice(0,18)}...</td><td>${u.total_calls||0}</td><td>X${(u.total_billed||0).toFixed(2)}</td><td>${t.is_active?'<span style="color:#16a34a">启用</span>':'<span style="color:#dc2626">禁用</span>'}</td><td><select class="plan-select" onchange="changePlan(${t.id},this.value)"><option value="free" ${t.plan==='free'?'selected':''}>免费</option><option value="basic" ${t.plan==='basic'?'selected':''}>基础</option><option value="pro" ${t.plan==='pro'?'selected':''}>专业</option></select> <button class="btn btn-sm ${t.is_active?'btn-danger':'btn-primary'}" onclick="toggleActive(${t.id},${t.is_active?0:1})">${t.is_active?'禁用':'启用'}</button></td></tr>`;
    });
  }catch(e){}
  try{const r=await fetch(BASE+'/api/admin/registrations?days=30');const d=await r.json();document.getElementById('regTable').innerHTML='<tr><th>时间</th><th>名称</th><th>邮箱</th><th>联系人</th><th>IP</th></tr>';d.registrations.forEach(r=>document.getElementById('regTable').innerHTML+=`<tr><td>${(r.created_at||'').slice(0,16)}</td><td>${r.name||'-'}</td><td>${r.email||'-'}</td><td>${r.contact||'-'}</td><td style="font-size:10px">${r.ip_address||'-'}</td></tr>`);}catch(e){}
  try{const r=await fetch(BASE+'/api/admin/orders?days=90');const d=await r.json();document.getElementById('orderTable').innerHTML='<tr><th>时间</th><th>租户</th><th>升级前</th><th>升级后</th><th>金额</th><th>状态</th></tr>';d.orders.forEach(o=>document.getElementById('orderTable').innerHTML+=`<tr><td>${(o.created_at||'').slice(0,16)}</td><td>${o.tenant_name||'-'}</td><td>${o.plan_before||'-'}</td><td>${o.plan_after||'-'}</td><td>X${(o.amount||0).toFixed(2)}</td><td>${o.status||'-'}</td></tr>`);}catch(e){}
  try{const r=await fetch(BASE+'/api/admin/audio-files?limit=50');const d=await r.json();document.getElementById('audioTable').innerHTML='<tr><th>时间</th><th>租户</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr>';d.files.forEach(f=>{const kb=(f.file_size/1024).toFixed(1);document.getElementById('audioTable').innerHTML+=`<tr><td>${(f.created_at||'').slice(0,16)}</td><td>${f.tenant_name||'-'}</td><td>${f.patient_id||'-'}</td><td style="font-size:10px">${f.file_name||'-'}</td><td>${kb}KB</td><td>${(f.audio_duration||0).toFixed(1)}s</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(f.asr_text||'').slice(0,40)}</td></tr>`});}catch(e){}
}
async function changePlan(id,plan){await fetch(BASE+'/api/admin/tenants/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});loadAdmin();}
async function toggleActive(id,active){await fetch(BASE+'/api/admin/tenants/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:active})});loadAdmin();}
function showCreate(){document.getElementById('createModal').classList.add('show');}
async function doCreate(){
  const n=document.getElementById('createName').value.trim(),e=document.getElementById('createEmail').value.trim(),p=document.getElementById('createPlan').value;
  if(!n||!e)return alert('必填');const r=await fetch(BASE+'/api/admin/tenants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,email:e,plan:p})});
  alert('Key: '+((await r.json()).api_key||''));document.getElementById('createModal').classList.remove('show');loadAdmin();
}
loadAdmin();
</script>
<style>.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}.modal.show{display:flex}.modal>div{background:#fff;border-radius:12px;padding:24px;max-width:400px;width:90%}.modal h3{font-size:16px;margin-bottom:12px}.modal label{display:block;font-size:12px;color:var(--text-muted);margin:8px 0 4px}.modal input,.modal select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}</style>
</body>
</html>
