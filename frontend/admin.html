<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 — 超声报告语音结构化</title>
<style>
:root{--nav-bg:#0f172a;--nav-text:#94a3b8;--bg:#f1f5f9;--card-bg:#fff;--text:#1e293b;--text-muted:#64748b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06);--green:#059669;--blue:#3b82f6;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
nav{background:var(--nav-bg);padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
nav .brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
nav .brand span{font-size:10px;color:var(--nav-text);font-weight:400;margin-left:6px}
nav a{font-size:13px;color:var(--nav-text);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:6px;transition:all .15s}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav a.active{color:#fff;background:var(--green)}
main{max-width:1300px;margin:24px auto;padding:0 20px}
.summary{display:flex;gap:14px;margin-bottom:20px}
.summary .box{flex:1;background:var(--card-bg);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow)}
.summary .box .num{font-size:28px;font-weight:800;color:#1e40af}
.summary .box .label2{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:500}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:'';width:4px;height:14px;background:var(--green);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;background:#f8fafc;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:2px solid #e2e8f0}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-sm{padding:3px 8px;font-size:10px}
</style>
</head>
<body>

<nav>
  <div class="brand">UltraSonic AI<span>v4.0</span></div>
  <a href="/pad.html" style="font-weight:800;color:#fff">工作站</a>
  <a href="/keywords.html">关键词</a>
  <a href="/admin.html" class="active">管理</a>
  <a href="/dashboard.html">看板</a>
  <a href="/trace_logs.html">日志</a>
  <a href="/error_report.html">纠错</a>
</nav>

<main>
  <div class="summary">
    <div class="box"><div class="num" id="totalConfirm">0</div><div class="label2">已确认报告</div></div>
    <div class="box"><div class="num" id="totalDocs">0</div><div class="label2">医生数</div></div>
    <div class="box"><div class="num" id="totalFiles">0</div><div class="label2">音频文件</div></div>
  </div>

  <div class="card">
    <h2>反馈统计 — 模板确认率</h2>
    <table id="feedbackTable"><tr><th>模板名</th><th>确认次数</th></tr></table>
  </div>
  <div class="card"><h2>音频文件</h2><table id="audioTable"><tr><th>时间</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr></table></div>
</main>

<script>
async function api(method, path, body) {
  const opt = {method, headers: {'Content-Type': 'application/json'}};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  return r.json();
}

async function loadAdmin() {
  // 反馈统计
  try {
    const d = await api('GET', '/api/feedback/stats');
    if (d.success && d.total > 0) {
      document.getElementById('totalConfirm').textContent = d.total;
      const tbl = document.getElementById('feedbackTable');
      tbl.innerHTML = '<tr><th>模板名</th><th>确认次数</th></tr>';
      d.top_templates.forEach(t => {
        tbl.innerHTML += `<tr><td>${esc(t.template_used)}</td><td>${t.cnt}</td></tr>`;
      });
    }
  } catch(_) {}

  // 医生数量
  try {
    const d = await api('GET', '/api/doctors');
    if (d.success) document.getElementById('totalDocs').textContent = d.total;
  } catch(_) {}

  // 音频文件
  try {
    const r = await fetch('/api/admin/audio-files?limit=50');
    const d = await r.json();
    document.getElementById('totalFiles').textContent = d.files ? d.files.length : '0';
    const tbl = document.getElementById('audioTable');
    tbl.innerHTML = '<tr><th>时间</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr>';
    if (d.files) d.files.forEach(f => {
      tbl.innerHTML += `<tr><td>${(f.created_at||'').slice(0,16)}</td><td>${f.patient_id||'-'}</td><td style="font-size:10px">${esc(f.file_name||'-')}</td><td>${((f.file_size||0)/1024).toFixed(1)}KB</td><td>${(f.audio_duration||0).toFixed(1)}s</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((f.asr_text||'').slice(0,40))}</td></tr>`;
    });
  } catch(_) {}
}

function esc(t){const e=document.createElement('span');e.textContent=String(t??'');return e.innerHTML;}

loadAdmin();
</script>
</body>
</html>
