<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 — 超声报告语音结构化 API</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1e293b}
nav{background:#0f172a;color:white;padding:0 16px;height:48px;display:flex;align-items:center;gap:24px;font-size:13px}
nav h1{font-size:15px}
nav a{color:#94a3b8;text-decoration:none}
nav a:hover,nav a.active{color:white}
main{max-width:1200px;margin:20px auto;padding:0 12px}
.card{background:white;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e2e8f0}
th{color:#64748b;font-weight:500;font-size:12px;background:#f8fafc}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.badge-free{background:#e2e8f0;color:#475569}
.badge-basic{background:#dcfce7;color:#16a34a}
.badge-pro{background:#fef3c7;color:#d97706}
.btn{display:inline-block;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:#3b82f6;color:white}
.btn-danger{background:#dc2626;color:white}
.btn-sm{padding:3px 10px;font-size:11px}
select.plan-select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px}
.summary-box{display:flex;gap:16px;margin-bottom:20px}
.summary-item{flex:1;background:white;border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary-item .num{font-size:28px;font-weight:700;color:#1e40af}
.summary-item .label{font-size:12px;color:#64748b;margin-top:4px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal>div{background:white;border-radius:12px;padding:24px;max-width:420px;width:90%}
.modal h3{font-size:16px;margin-bottom:12px}
.modal label{display:block;font-size:13px;color:#64748b;margin-bottom:4px;margin-top:8px}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}
</style>
</head>
<body>

<nav>
  <h1>超声报告语音结构化 API</h1>
  <a href="/developer.html">开发者门户</a>
  <a href="/plans.html">套餐购买</a>
  <a href="/admin.html" class="active">管理后台</a>
</nav>

<main>
  <!-- 概览 -->
  <div class="summary-box">
    <div class="summary-item"><div class="num" id="totalTenants">-</div><div class="label">租户数</div></div>
    <div class="summary-item"><div class="num" id="totalCalls">-</div><div class="label">本月调用</div></div>
    <div class="summary-item"><div class="num" id="totalBilled">-</div><div class="label">本月收入</div></div>
  </div>

  <!-- 租户列表 -->
  <div class="card">
    <h2>租户列表 <button class="btn btn-primary btn-sm" onclick="showCreate()" style="float:right">新建租户</button></h2>
    <table id="tenantTable">
      <tr><th>ID</th><th>名称</th><th>套餐</th><th>API Key</th><th>本月调用</th><th>本月费用</th><th>状态</th><th>操作</th></tr>
    </table>
  </div>

  <!-- 注册记录 -->
  <div class="card">
    <h2>注册记录</h2>
    <table id="regTable"><tr><th>日期</th><th>名称</th><th>邮箱</th><th>联系人</th><th>IP</th></tr></table>
  </div>

  <!-- 订单记录 -->
  <div class="card">
    <h2>订单记录</h2>
    <table id="orderTable"><tr><th>日期</th><th>租户</th><th>升级前</th><th>升级后</th><th>金额</th><th>状态</th></tr></table>
  </div>

  <!-- 音频文件 -->
  <div class="card">
    <h2>音频文件</h2>
    <table id="audioTable"><tr><th>日期</th><th>租户</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr></table>
  </div>
</main>

<div class="modal" id="createModal">
  <div>
    <h3>新建租户</h3>
    <label>名称</label><input id="createName" placeholder="XX医院">
    <label>邮箱</label><input id="createEmail" placeholder="xx@hospital.cn">
    <label>套餐</label>
    <select id="createPlan"><option value="free" selected>免费版</option><option value="basic">基础版</option><option value="pro">专业版</option></select>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="doCreate()">创建</button>
      <button class="btn" style="background:#e2e8f0" onclick="document.getElementById('createModal').classList.remove('show')">取消</button>
    </div>
  </div>
</div>

<script>
const BASE = 'http://47.109.151.238:80';

async function loadAdmin() {
  try {
    const r = await fetch(BASE+'/api/admin/usage');
    const d = await r.json();
    document.getElementById('totalTenants').textContent = d.summary.total_tenants;
    document.getElementById('totalCalls').textContent = d.summary.total_calls;
    document.getElementById('totalBilled').textContent = '¥'+d.summary.total_billed.toFixed(0);

    const tr = await fetch(BASE+'/api/admin/tenants');
    const td = await tr.json();
    const table = document.getElementById('tenantTable');
    table.innerHTML = '<tr><th>ID</th><th>名称</th><th>套餐</th><th>API Key</th><th>本月调用</th><th>本月费用</th><th>状态</th><th>操作</th></tr>';
    td.tenants.forEach(t => {
      const u = t.monthly_usage||{};
      const badge = t.plan==='free'?'badge-free':t.plan==='basic'?'badge-basic':'badge-pro';
      table.innerHTML += `<tr>
        <td>${t.id}</td>
        <td><b>${t.name||'-'}</b></td>
        <td><span class="badge ${badge}">${t.plan}</span></td>
        <td style="font-family:monospace;font-size:11px">${(t.api_key||'').substring(0,20)}...</td>
        <td>${u.total_calls||0}</td>
        <td>¥${(u.total_billed||0).toFixed(2)}</td>
        <td>${t.is_active?'<span style="color:#16a34a">启用</span>':'<span style="color:#dc2626">禁用</span>'}</td>
        <td>
          <select class="plan-select" onchange="changePlan(${t.id},this.value)" data-current="${t.plan}">
            <option value="free" ${t.plan==='free'?'selected':''}>免费</option>
            <option value="basic" ${t.plan==='basic'?'selected':''}>基础</option>
            <option value="pro" ${t.plan==='pro'?'selected':''}>专业</option>
          </select>
          <button class="btn btn-sm ${t.is_active?'btn-danger':'btn-primary'}" onclick="toggleActive(${t.id},${t.is_active?0:1})">${t.is_active?'禁用':'启用'}</button>
        </td>
      </tr>`;
    });
  } catch(e) { console.error(e); }
}

async function changePlan(id, plan) {
  if (!confirm('确认切换套餐?')) { location.reload(); return; }
  await fetch(BASE+'/api/admin/tenants/'+id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({plan})
  });
  loadAdmin();
}

async function toggleActive(id, active) {
  await fetch(BASE+'/api/admin/tenants/'+id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({is_active: active})
  });
  loadAdmin();
}

function showCreate() { document.getElementById('createModal').classList.add('show'); }

async function doCreate() {
  const name = document.getElementById('createName').value.trim();
  const email = document.getElementById('createEmail').value.trim();
  const plan = document.getElementById('createPlan').value;
  if (!name||!email) { alert('名称和邮箱必填'); return; }
  const r = await fetch(BASE+'/api/admin/tenants', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name,email,plan})
  });
  const d = await r.json();
  alert('创建成功! API Key: '+d.api_key);
  document.getElementById('createModal').classList.remove('show');
  loadAdmin();
}

async function loadAudioFiles() {
  try {
    const r = await fetch(BASE+'/api/admin/audio-files?limit=50');
    const d = await r.json();
    const table = document.getElementById('audioTable');
    table.innerHTML = '<tr><th>日期</th><th>租户</th><th>患者ID</th><th>文件名</th><th>大小</th><th>时长</th><th>ASR文本</th></tr>';
    (d.files||[]).forEach(f => {
      const sizeKB = (f.file_size/1024).toFixed(1);
      const dur = (f.audio_duration||0).toFixed(1)+'s';
      table.innerHTML += '<tr><td>'+(f.created_at||'').substring(0,16)+'</td><td>'+(f.tenant_name||'-')+'</td><td>'+(f.patient_id||'-')+'</td><td style=\"font-family:monospace;font-size:11px\">'+(f.file_name||'-')+'</td><td>'+sizeKB+'KB</td><td>'+dur+'</td><td style=\"max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" title=\"'+(f.asr_text||'')+'\">'+(f.asr_text||'').substring(0,50)+'</td></tr>';
    });
  } catch(e) { console.error(e); }
}

async function loadOrders() {
  try {
    const r = await fetch(BASE+'/api/admin/orders?days=90');
    const d = await r.json();
    const table = document.getElementById('orderTable');
    table.innerHTML = '<tr><th>日期</th><th>租户</th><th>升级前</th><th>升级后</th><th>金额</th><th>状态</th></tr>';
    (d.orders||[]).forEach(o => {
      table.innerHTML += '<tr><td>'+(o.created_at||'').substring(0,16)+'</td><td>'+(o.tenant_name||'-')+'</td><td>'+(o.plan_before||'-')+'</td><td>'+(o.plan_after||'-')+'</td><td>¥'+(o.amount||0).toFixed(2)+'</td><td>'+(o.status||'-')+'</td></tr>';
    });
  } catch(e) { console.error(e); }
}

async function loadRegistrations() {
  try {
    const r = await fetch(BASE+'/api/admin/registrations?days=30');
    const d = await r.json();
    const table = document.getElementById('regTable');
    table.innerHTML = '<tr><th>日期</th><th>名称</th><th>邮箱</th><th>联系人</th><th>IP</th></tr>';
    (d.registrations||[]).forEach(r => {
      table.innerHTML += '<tr><td>'+(r.created_at||'').substring(0,16)+'</td><td>'+(r.name||'-')+'</td><td>'+(r.email||'-')+'</td><td>'+(r.contact||'-')+'</td><td style=\"font-family:monospace;font-size:11px\">'+(r.ip_address||'-')+'</td></tr>';
    });
  } catch(e) { console.error(e); }
}

loadAdmin();
loadAudioFiles();
loadOrders();
loadRegistrations();
</script>
</body>
</html>
