<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超声平板 - 主任极简 / 实时听写</title>
<style>
:root{--bg1:#07111f;--bg2:#0f172a;--bg3:#102a43;--card:rgba(15,23,42,.72);--card2:rgba(30,41,59,.78);--glass:rgba(255,255,255,.08);--line:rgba(148,163,184,.22);--text:#e5f0ff;--muted:#9fb3cc;--blue:#38bdf8;--blue2:#1d4ed8;--green:#34d399;--red:#fb7185;--orange:#fbbf24;--shadow:0 22px 60px rgba(0,0,0,.32);--radius:28px;--radius-inner:18px;--font:'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;overflow:hidden;font-family:var(--font);color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(56,189,248,.28),transparent 32%),radial-gradient(circle at 92% 8%,rgba(29,78,216,.26),transparent 36%),linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.1));pointer-events:none}.app{position:relative;z-index:1;height:100vh;padding:20px;display:flex;flex-direction:column;gap:12px}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 32px rgba(56,189,248,.3)}.brand h1{font-size:24px;letter-spacing:.3px}.brand p{font-size:13px;color:var(--muted);margin-top:1px}.mode-switch{display:flex;gap:6px;background:rgba(255,255,255,.08);border-radius:18px;padding:4px;border:1px solid var(--line)}.mode-btn{border:none;border-radius:14px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);transition:.15s;font-family:var(--font)}.mode-btn.on{background:var(--blue);color:#062033;box-shadow:0 0 20px rgba(56,189,248,.35)}.mode-btn:hover:not(.on){color:var(--text)}
.clock{text-align:right;color:var(--muted);font-size:13px}.clock strong{display:block;color:var(--text);font-size:22px}
.view{flex:1;min-height:0}.screen{display:none;height:100%}.screen.on{display:block}
.queue-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;height:100%}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.panel-hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800}.panel-bd{padding:16px;height:calc(100% - 60px);overflow:auto}
.patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.patient-card{cursor:pointer;background:linear-gradient(180deg,rgba(15,23,42,.74),rgba(30,41,59,.68));border:1px solid rgba(148,163,184,.22);border-radius:22px;padding:18px;min-height:140px;transition:.18s;position:relative;overflow:hidden}.patient-card:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 0 28px rgba(56,189,248,.25)}.patient-card::after{content:'';position:absolute;right:-36px;top:-36px;width:100px;height:100px;border-radius:50%;background:rgba(56,189,248,.07)}
.p-name{font-size:28px;font-weight:900;margin-bottom:6px}.p-meta{font-size:15px;color:var(--muted);line-height:1.6}.p-tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--green);font-size:12px}
.side-stat{display:grid;gap:12px}.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:18px}.stat label{font-size:13px;color:var(--muted)}.stat div{font-size:32px;font-weight:900;margin-top:3px}
/* director record */
.big-state{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.patient-panel,.record-panel{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);padding:24px;display:flex;flex-direction:column}
.current-name{font-size:48px;font-weight:1000;margin-bottom:8px}.current-meta{font-size:20px;color:var(--muted);line-height:1.7}
.record-center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column}
.rec-button{width:220px;height:220px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#67e8f9,#0ea5e9 45%,#1d4ed8);color:#fff;box-shadow:0 0 44px rgba(56,189,248,.4),inset 0 -14px 30px rgba(0,0,0,.18);font-size:24px;font-weight:900;transition:.18s;font-family:var(--font)}.rec-button:hover{transform:scale(1.02)}.rec-button.recording{background:radial-gradient(circle at 35% 30%,#fda4af,#fb7185 45%,#be123c);box-shadow:0 0 60px rgba(251,113,133,.5);animation:pulse 1.1s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}.timer{font-size:56px;font-weight:1000;font-family:ui-monospace,Menlo,monospace;margin-top:22px}.wave{display:flex;gap:6px;height:48px;align-items:center;margin-top:14px}.wave span{display:block;width:7px;border-radius:7px;background:var(--blue);height:16px;animation:wave 1s infinite ease-in-out}.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}.wave span:nth-child(6){animation-delay:.5s}@keyframes wave{0%,100%{height:12px;opacity:.5}50%{height:46px;opacity:1}}
.process{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.process h2{font-size:40px;margin-bottom:16px}.process p{font-size:20px;color:var(--muted);line-height:1.7}.spinner{width:72px;height:72px;border-radius:50%;border:6px solid rgba(255,255,255,.12);border-top-color:var(--blue);animation:spin .8s linear infinite;margin-bottom:22px}@keyframes spin{to{transform:rotate(360deg)}}.done-icon{font-size:80px;margin-bottom:18px}
/* tablet live */
.live-panel{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%}
.live-panel .card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);display:flex;flex-direction:column;overflow:hidden}.card-hd{padding:12px 18px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.card-bd{padding:14px 16px;flex:1;overflow:auto}
.recognized{font-size:26px;line-height:1.6;letter-spacing:.3px;word-wrap:break-word}.recognized .interim{color:var(--muted)}.final-box{margin-top:10px;background:rgba(15,23,42,.5);border:1px dashed rgba(148,163,184,.25);border-radius:14px;padding:12px;font-size:16px;line-height:1.6;max-height:140px;overflow:auto;white-space:pre-wrap;color:var(--muted)}
.tpl-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.tpl-card{background:rgba(15,23,42,.5);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.tpl-card label{display:block;font-size:12px;color:var(--muted)}.tpl-card div{font-size:18px;font-weight:700;margin-top:4px}.live-report{margin-top:10px}.live-report h3{font-size:14px;color:var(--blue);margin-bottom:5px}.live-text{background:rgba(15,23,42,.5);border:1px solid rgba(148,163,184,.15);border-radius:12px;padding:10px;font-size:16px;line-height:1.6;min-height:48px;white-space:pre-wrap;color:#c8d6e5}.seg-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;margin-right:4px;vertical-align:middle}.seg-done{background:rgba(56,189,248,.12);color:var(--blue)}.seg-live{background:rgba(251,191,36,.15);color:var(--orange);animation:segPulse 1.2s infinite}@keyframes segPulse{0%,100%{opacity:1}50%{opacity:.5}}
.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:800;cursor:pointer;font-family:var(--font)}.btn-soft{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text)}.btn-blue{background:var(--blue);color:#062033}.btn-danger{background:var(--red);color:#fff}.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:16px;padding:12px 22px;color:var(--text);font-size:17px;box-shadow:var(--shadow);display:none;z-index:99}.toast.on{display:block}
.https-warn{display:none;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.45);color:#fde68a;border-radius:14px;padding:10px 14px;font-size:13px;margin-top:8px}.error{color:var(--red)}
/* review modal */
.review{z-index:100;position:fixed;inset:0;background:rgba(7,17,31,.96);display:flex;align-items:center;justify-content:center;padding:24px}.review-box{width:70vw;max-width:900px;max-height:86vh;background:rgba(20,30,50,.94);border:1px solid var(--line);border-radius:30px;box-shadow:0 40px 100px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;animation:fadeIn .22s}@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.review-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.review-head h2{font-size:26px;font-weight:900}.review-head small{font-size:14px;color:var(--muted)}.review-body{padding:20px 26px;overflow:auto;flex:1}.review-item{margin-bottom:16px}.review-item h3{font-size:14px;color:var(--blue);margin-bottom:6px}.review-text{padding:14px 16px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.15);border-radius:14px;font-size:22px;line-height:1.7;min-height:50px;color:#c8d6e5}.recognized-value{color:#38bdf8;font-weight:700;background:rgba(56,189,248,.08);padding:0 2px;border-radius:3px}.missing-var{color:#fbbf24;border-bottom:2px dashed #fbbf24;padding:0 4px;font-weight:700;background:rgba(251,191,36,.08);border-radius:2px}.cand-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.cand-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(15,23,42,.5);border:1px solid rgba(148,163,184,.2);cursor:pointer;transition:.15s;min-width:120px}.cand-row:hover,.cand-row.on{border-color:var(--blue);background:rgba(56,189,248,.12)}.cand-score{font-weight:900;font-size:15px;min-width:36px}.cand-score.high{color:var(--green)}.cand-score.mid{color:var(--orange)}.cand-score.low{color:var(--red)}.cand-name{font-size:14px;color:var(--text)}.review-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}.review-foot .btn{padding:14px 24px;font-size:18px}
@media(max-width:1000px){.queue-layout,.big-state,.live-panel{grid-template-columns:1fr}.app{overflow:auto;height:auto}.screen{height:auto}.rec-button{width:200px;height:200px}.current-name{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">🩺</div><div><h1 id="mainTitle">超声平板</h1><p id="modeHint">主任极简 · 选病人 录语音 自动生成</p><div id="httpsWarn" class="https-warn">录音需要 HTTPS，请使用 https://47.109.151.238/pad.html</div></div></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="mode-switch"><button id="modeDirector" class="mode-btn on">主任极简</button><button id="modeTablet" class="mode-btn">实时听写</button></div>
      <div class="clock"><strong id="clockTime">--:--</strong><span id="clockDate">----</span></div>
    </div>
  </header>
  <main class="view">
    <!-- 患者列表 -->
    <section id="screenList" class="screen on">
      <div class="queue-layout">
        <div class="panel"><div class="panel-hd"><span>待检患者</span><div class="actions"><button class="btn btn-ghost" id="mockBtn">模拟患者</button><button class="btn btn-blue" id="refreshBtn">刷新</button></div></div><div class="panel-bd"><div id="patientGrid" class="patient-grid">加载中...</div></div></div>
        <aside class="panel"><div class="panel-hd">概览</div><div class="panel-bd"><div class="side-stat"><div class="stat"><label>待检人数</label><div id="statWaiting">--</div></div><div class="stat"><label id="modeSteps">操作步骤</label><div id="stepGuide" style="font-size:20px;line-height:1.8">1 选患者<br>2 开始录音<br>3 停止生成</div></div><div class="stat"><label>状态</label><div id="listStatus" style="font-size:22px">等待选择</div></div></div></div></aside>
      </div>
    </section>
    <!-- 录制中 / 主任模式 -->
    <section id="screenDirector" class="screen">
      <div class="big-state">
        <div class="patient-panel"><div class="actions"><button class="btn btn-ghost" id="backBtn">← 返回</button></div><div style="flex:1;display:flex;justify-content:center;flex-direction:column"><div class="current-name" id="currentName">-</div><div class="current-meta" id="currentMeta">-</div><div class="p-tag" id="currentTag">已缴费</div></div></div>
        <div class="record-panel"><div class="record-center"><button id="recordBtn" class="rec-button">🎤<br>开始</button><div id="timer" class="timer">00:00</div><div id="wave" class="wave" style="display:none"><span></span><span></span><span></span><span></span><span></span><span></span></div><div id="recordHint" style="margin-top:14px;font-size:18px;color:var(--muted)">点击开始录音</div></div></div>
      </div>
    </section>
    <!-- 处理中 -->
    <section id="screenProcess" class="screen"><div class="process"><div class="spinner"></div><h2 id="processTitle">正在生成报告</h2><p id="processText">保存音频 → ASR识别 → 合并文本 → 生成报告</p></div></section>
    <!-- 实时听写模式 -->
    <section id="screenTablet" class="screen">
      <div class="live-panel">
        <div class="card"><div class="card-hd"><span>实时识别</span><span style="font-size:13px;color:var(--muted)" id="liPatient">未选择患者</span></div><div class="card-bd" style="overflow:hidden;display:flex;flex-direction:column">
          <div style="overflow:auto;flex:1">
            <div id="recognizedText" class="recognized">等待语音输入...</div>
            <div class="final-box"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">已确认文本</div><div id="finalOnly">(等待语音输入)</div></div>
          </div>
          <div class="actions" style="margin-top:10px;flex-shrink:0">
            <button class="btn btn-blue" id="tabletListenBtn" disabled>🎤 开始实时ASR</button>
            <button class="btn btn-ghost" id="tabletClearBtn" disabled>清空</button>
            <button class="btn btn-ghost" id="tabletDoneBtn" disabled>确认报告</button>
          </div>
        </div></div>
        <div class="card"><div class="card-hd">实时理解 / 报告草稿</div><div class="card-bd">
          <div class="tpl-hero"><div class="tpl-card"><label>模板</label><div id="tplName">-</div></div><div class="tpl-card"><label>置信度</label><div id="tplConf">--</div></div><div class="tpl-card"><label>部位</label><div id="tplSite">-</div></div></div>
          <div class="live-report"><h3>📖 超声所见</h3><div id="previewSee" class="live-text">-</div></div>
          <div class="live-report"><h3>💊 超声提示</h3><div id="previewHint" class="live-text">-</div></div>
          <div class="live-report"><h3>🎤 ASR原文</h3><div id="previewSource" class="live-text" style="font-size:13px;color:var(--muted)">-</div></div>
        </div></div>
      </div>
    </section>
    <section id="screenReview" class="screen"><div class="process"><div class="done-icon">✅</div><h2>报告已生成</h2><p id="doneText">请查看确认弹窗</p></div></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="reviewOverlay" class="review" style="display:none"></div>
<script src="/pad.js?v=20260609"></script>
</body>
</html>
