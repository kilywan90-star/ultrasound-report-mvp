<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>套餐购买 — 超声报告语音结构化 API</title>
<style>
:root{--nav-bg:#0f172a;--nav-text:#94a3b8;--bg:#f1f5f9;--card-bg:#fff;--text:#1e293b;--text-muted:#64748b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06);--green:#059669;--blue:#3b82f6;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
nav{background:var(--nav-bg);padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
nav .brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
nav .brand span{font-size:10px;color:var(--nav-text);font-weight:400;margin-left:6px}
nav a{font-size:13px;color:var(--nav-text);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:6px;transition:all .15s}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav a.active{color:#fff;background:var(--green)}
main{max-width:960px;margin:24px auto;padding:0 20px}
.card{background:var(--card-bg);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:17px;font-weight:700;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px 14px;background:#f8fafc;color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0}
td{padding:14px;text-align:center;border-bottom:1px solid #f1f5f9}
td:first-child{text-align:left;font-weight:600}
.price{font-size:26px;font-weight:800}.price.free{color:var(--text-muted)}.price.basic{color:var(--green)}.price.pro{color:var(--amber)}
.btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#047857}
.btn-ghost{background:#e2e8f0;color:var(--text);cursor:default}
.step{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:14px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.qr{text-align:center;padding:16px;background:#f8fafc;border-radius:8px;margin:10px 0}
.qr>div{width:140px;height:140px;margin:8px auto;background:#e2e8f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)}
.highlight{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:12px;margin:10px 0;font-size:13px;display:none}
</style>
</head>
<body>

<nav>
  <div class="brand">UltraSonic AI<span>v4.2</span></div>
  <a href="/">工作站</a>
  <a href="/developer.html">开发者</a>
  <a href="/plans.html" class="active">套餐</a>
  <a href="/admin.html">管理</a>
  <a href="/dashboard.html">看板</a>
  <a href="/trace_logs.html">日志</a>
  <a href="/error_report.html">纠错</a>
</nav>

<main>
  <div class="card">
    <h2>套餐方案</h2>
    <table>
      <tr><th></th><th>免费版</th><th style="color:var(--green)">基础版 — 推荐</th><th style="color:var(--amber)">专业版</th></tr>
      <tr><td>月费</td><td><span class="price free">¥0</span></td><td><span class="price basic">¥99</span></td><td><span class="price pro">¥299</span></td></tr>
      <tr><td>调用次数/月</td><td>100</td><td>1,000</td><td>5,000</td></tr>
      <tr><td>超量单价</td><td style="color:#dc2626">不可用</td><td>¥0.15/次</td><td>¥0.10/次</td></tr>
      <tr><td>API速率</td><td>5次/分钟</td><td>20次/分钟</td><td>60次/分钟</td></tr>
      <tr><td>语音时长</td><td>前30秒免费</td><td>前30秒免费, 超时¥0.0008/s</td><td>前30秒免费, 超时¥0.0005/s</td></tr>
      <tr><td>技术支持</td><td>文档</td><td>邮件+文档</td><td>微信+邮件+文档</td></tr>
      <tr><td></td><td><button class="btn btn-ghost">当前套餐</button></td><td><button class="btn btn-success" onclick="buy('basic')">¥99/月</button></td><td><button class="btn btn-primary" onclick="buy('pro')">¥299/月</button></td></tr>
    </table>
  </div>

  <div class="card" id="buySection" style="display:none">
    <h2>购买 <span id="buyPlanName"></span></h2>
    <div class="step"><span class="step-num">1</span><div>扫码支付 <b id="buyPrice"></b></div></div>
    <div class="qr"><div>收款码</div><div style="font-size:10px;color:var(--text-muted)">备注: <span id="payNote"></span></div></div>
    <div class="step"><span class="step-num">2</span><div>输入 API Key 确认升级</div></div>
    <input id="buyApiKey" placeholder="sk-..." style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;margin:8px 0;max-width:420px"><br>
    <button class="btn btn-success" onclick="doUpgrade()" style="margin-top:8px">确认支付并升级</button>
    <div class="highlight" id="upgradeResult"></div>
  </div>
</main>

<script>
const BASE='http://47.109.151.238:80';
function buy(plan){
  document.getElementById('buySection').style.display='block';
  const names={basic:'基础版',pro:'专业版'},prices={basic:'¥99/月',pro:'¥299/月'};
  document.getElementById('buyPlanName').textContent=names[plan];
  document.getElementById('buyPrice').textContent=prices[plan];
  document.getElementById('payNote').textContent='plan-'+plan+'-'+Date.now().toString(36);
  document.getElementById('buySection').setAttribute('data-plan',plan);
  document.getElementById('buyApiKey').value=localStorage.getItem('dev_api_key')||'';
}
async function doUpgrade(){
  const plan=document.getElementById('buySection').getAttribute('data-plan');
  const key=document.getElementById('buyApiKey').value.trim();if(!key)return alert('请输入API Key');
  try{
    const r=await fetch(BASE+'/api/admin/upgrade-by-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key,plan})});
    const d=await r.json();const el=document.getElementById('upgradeResult');el.style.display='block';
    if(d.success){el.style.background='#dcfce7';el.style.border='1px solid #16a34a';el.innerHTML='升级成功: <b>'+d.plan_name+'</b>, 配额 '+d.monthly_quota+'次/月';}
    else{el.style.background='#fee2e2';el.style.border='1px solid #dc2626';el.innerHTML='失败: '+d.msg;}
  }catch(e){alert('网络错误')}
}
</script>
</body>
</html>
