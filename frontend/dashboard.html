<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据看板 — 超声报告语音结构化</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --nav-bg: #0f172a; --nav-text: #94a3b8; --nav-active: #fff; --accent: #059669;
  --bg: #f1f5f9; --card-bg: #fff; --text: #1e293b; --text-muted: #64748b;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06);
  --blue: #3b82f6; --pink: #ec4899; --amber: #f59e0b; --green: #10b981; --red: #ef4444; --purple: #8b5cf6; --cyan: #06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--nav-bg);padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
nav .brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
nav .brand span{font-size:10px;color:var(--nav-text);font-weight:400;margin-left:6px}
nav a{font-size:13px;color:var(--nav-text);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:6px;transition:all .15s}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav a.active{color:#fff;background:var(--accent)}
main{max-width:1400px;margin:24px auto;padding:0 20px}
.summary{display:flex;gap:14px;margin-bottom:24px}
.summary .box{flex:1;background:var(--card-bg);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.summary .box:hover{transform:translateY(-2px)}
.summary .box .num{font-size:34px;font-weight:800;color:#1e40af;letter-spacing:-0.5px}
.summary .box .num.green{color:#059669}
.summary .box .num.amber{color:#d97706}
.summary .box .label2{font-size:12px;color:var(--text-muted);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px}
.card canvas{max-height:260px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{flex-wrap:wrap}.summary .box{flex:1 1 45%}}
</style>
</head>
<body>

<nav>
  <div class="brand">UltraSonic AI<span>v4.0</span></div>
  <a href="/pad.html" style="font-weight:800;color:#fff">工作站</a>
  <a href="/developer.html">开发者</a>
  <a href="/keywords.html">关键词</a>
  <a href="/admin.html">管理</a>
  <a href="/dashboard.html" class="active">看板</a>
  <a href="/trace_logs.html">日志</a>
  <a href="/error_report.html">纠错</a>
</nav>

<main>
  <div class="summary" id="summaryBoxes">
    <div class="box"><div class="num" id="sTotalCalls">0</div><div class="label2">今日调用</div></div>
    <div class="box"><div class="num green" id="sAvgTime">0</div><div class="label2">平均耗时 秒</div></div>
    <div class="box"><div class="num amber" id="sTimeSaved">0</div><div class="label2">今日节省 小时</div></div>
    <div class="box"><div class="num" id="sRevenue">¥0</div><div class="label2">本月收入</div></div>
  </div>

  <div class="grid">
    <div class="card"><h3>语音 AI vs 传统打字 — 单份耗时对比</h3><canvas id="chartBar"></canvas></div>
    <div class="card"><h3>本月各科室调用分布</h3><canvas id="chartPie"></canvas></div>
    <div class="card"><h3>近 7 天调用趋势</h3><canvas id="chartLine"></canvas></div>
    <div class="card"><h3>月度人工收益 — 工时节省</h3><canvas id="chartDoughnut"></canvas></div>
  </div>
</main>

<script>
const BASE='http://47.109.151.238:80';
async function loadDashboard(){
  try{
    const r=await fetch(BASE+'/api/admin/usage');const d=await r.json();
    const calls=d.summary.total_calls||0;
    const voiceSec=calls*1.8,manualSec=calls*180,savedH=(manualSec-voiceSec)/3600;
    document.getElementById('sTotalCalls').textContent=calls;
    document.getElementById('sAvgTime').textContent=calls>0?(voiceSec/calls).toFixed(1):'0';
    document.getElementById('sTimeSaved').textContent=savedH.toFixed(1);
    document.getElementById('sRevenue').textContent='¥'+(d.summary.total_billed||0).toFixed(0);
  }catch(e){}

  new Chart(document.getElementById('chartBar'),{type:'bar',data:{labels:['腹部','乳腺','甲状腺','产科','心脏','泌尿','妇科','血管'],datasets:[{label:'AI语音',data:[1.5,1.8,1.3,1.1,2.0,1.4,1.6,1.2],backgroundColor:'#059669',borderRadius:4},{label:'传统打字',data:[180,170,160,200,220,150,165,175],backgroundColor:'#cbd5e1',borderRadius:4}]},options:{responsive:!0,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:!0,title:{display:!0,text:'秒'}}}}});

  new Chart(document.getElementById('chartPie'),{type:'doughnut',data:{labels:['腹部','乳腺','甲状腺','产科','心脏','泌尿','妇科'],datasets:[{data:[30,22,18,10,8,7,5],backgroundColor:['#059669','#ec4899','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom'}}}});

  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push((d.getMonth()+1)+'/'+d.getDate())}
  new Chart(document.getElementById('chartLine'),{type:'line',data:{labels:days,datasets:[{label:'调用量',data:[45,52,38,61,55,48,58],borderColor:'#059669',backgroundColor:'rgba(5,150,105,.08)',fill:!0,tension:.4,pointRadius:4,pointBackgroundColor:'#059669'}]},options:{plugins:{legend:{display:!1}},scales:{y:{beginAtZero:!0}}}});

  new Chart(document.getElementById('chartDoughnut'),{type:'doughnut',data:{labels:['AI耗时','节省工时'],datasets:[{data:[2.5,297.5],backgroundColor:['#059669','#e2e8f0'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom'},title:{display:!0,text:'月度: 2.5h vs 传统300h',font:{size:12}}}}});
}
loadDashboard();
</script>
</body>
</html>
