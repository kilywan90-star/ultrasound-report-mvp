<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>主任极简模式 - 超声报告</title>
<style>
:root{--bg1:#07111f;--bg2:#0f172a;--bg3:#102a43;--card:rgba(15,23,42,.72);--card2:rgba(30,41,59,.78);--glass:rgba(255,255,255,.08);--line:rgba(148,163,184,.22);--text:#e5f0ff;--muted:#9fb3cc;--blue:#38bdf8;--blue2:#1d4ed8;--green:#34d399;--red:#fb7185;--orange:#fbbf24;--shadow:0 22px 60px rgba(0,0,0,.32);--radius:28px;--font:'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;overflow:hidden;font-family:var(--font);color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(56,189,248,.28),transparent 32%),radial-gradient(circle at 92% 8%,rgba(29,78,216,.26),transparent 36%),linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.1));pointer-events:none}.app{position:relative;z-index:1;height:100vh;padding:22px;display:flex;flex-direction:column;gap:18px}.top{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:16px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#38bdf8,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 38px rgba(56,189,248,.35)}.brand h1{font-size:28px;letter-spacing:.5px}.brand p{font-size:14px;color:var(--muted);margin-top:2px}.clock{text-align:right;color:var(--muted);font-size:14px}.clock strong{display:block;color:var(--text);font-size:24px}.view{flex:1;min-height:0}.screen{display:none;height:100%}.screen.on{display:block}.queue-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;height:100%}.panel{height:100%;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.panel-hd{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:20px;font-weight:800}.panel-bd{padding:20px;height:calc(100% - 68px);overflow:auto}.patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.patient-card{cursor:pointer;background:linear-gradient(180deg,rgba(15,23,42,.74),rgba(30,41,59,.68));border:1px solid rgba(148,163,184,.22);border-radius:24px;padding:20px;min-height:152px;transition:.18s;position:relative;overflow:hidden}.patient-card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 0 32px rgba(56,189,248,.28)}.patient-card::after{content:'';position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(56,189,248,.08)}.p-name{font-size:30px;font-weight:900;margin-bottom:8px}.p-meta{font-size:16px;color:var(--muted);line-height:1.7}.p-tag{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--green);font-size:13px}.side-stat{display:grid;gap:14px}.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:22px;padding:20px}.stat label{font-size:14px;color:var(--muted)}.stat div{font-size:36px;font-weight:900;margin-top:4px}.big-state{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px}.patient-panel,.record-panel{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);padding:28px;display:flex;flex-direction:column}.current-name{font-size:52px;font-weight:1000;margin-bottom:10px}.current-meta{font-size:22px;color:var(--muted);line-height:1.8}.record-center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column}.rec-button{width:260px;height:260px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#67e8f9,#0ea5e9 45%,#1d4ed8);color:#fff;box-shadow:0 0 52px rgba(56,189,248,.45),inset 0 -18px 36px rgba(0,0,0,.18);font-size:28px;font-weight:900;transition:.18s;font-family:var(--font)}.rec-button:hover{transform:scale(1.03)}.rec-button.recording{background:radial-gradient(circle at 35% 30%,#fda4af,#fb7185 45%,#be123c);box-shadow:0 0 72px rgba(251,113,133,.55);animation:pulse 1.1s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}.timer{font-size:62px;font-weight:1000;font-family:ui-monospace,Menlo,monospace;margin-top:28px}.wave{display:flex;gap:7px;height:56px;align-items:center;margin-top:18px}.wave span{display:block;width:8px;border-radius:8px;background:var(--blue);height:18px;animation:wave 1s infinite ease-in-out}.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}.wave span:nth-child(6){animation-delay:.5s}@keyframes wave{0%,100%{height:14px;opacity:.5}50%{height:54px;opacity:1}}.actions{display:flex;gap:12px}.btn{border:none;border-radius:18px;padding:15px 24px;font-size:18px;font-weight:800;cursor:pointer;font-family:var(--font)}.btn-soft{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text)}.btn-blue{background:var(--blue);color:#062033}.process{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.process h2{font-size:46px;margin-bottom:18px}.process p{font-size:22px;color:var(--muted);line-height:1.8}.spinner{width:82px;height:82px;border-radius:50%;border:7px solid rgba(255,255,255,.12);border-top-color:var(--blue);animation:spin .8s linear infinite;margin-bottom:28px}@keyframes spin{to{transform:rotate(360deg)}}.done-icon{font-size:88px;margin-bottom:22px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:18px;padding:14px 24px;color:var(--text);font-size:18px;box-shadow:var(--shadow);display:none}.toast.on{display:block}.https-warn{display:none;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.45);color:#fde68a;border-radius:16px;padding:12px 16px;font-size:14px;margin-top:10px}.error{color:var(--red)}.review{z-index:100;position:fixed;inset:0;background:rgba(7,17,31,.96);display:flex;align-items:center;justify-content:center;padding:30px}.review-box{width:72vw;max-width:960px;max-height:88vh;background:rgba(20,30,50,.94);border:1px solid var(--line);border-radius:32px;box-shadow:0 40px 120px rgba(0,0,0,.54);overflow:hidden;display:flex;flex-direction:column;animation:fadeIn .24s}@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.review-head{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.review-head h2{font-size:30px;font-weight:900}.review-head small{font-size:16px;color:var(--muted)}.review-body{padding:24px 28px;overflow:auto;flex:1}.review-item{margin-bottom:18px}.review-item h3{font-size:15px;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:10px}.review-text{padding:16px 18px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.15);border-radius:16px;font-size:25px;line-height:1.75;min-height:58px}.recognized-value{color:#10b981;font-weight:700}.missing-var{color:#f59e0b;border-bottom:2px dashed #f59e0b;padding:0 4px;font-weight:700}.review-foot{padding:20px 28px;border-top:1px solid var(--line);display:flex;gap:14px;justify-content:flex-end}.review-foot .btn{padding:16px 28px;font-size:20px}@media(max-width:1000px){.queue-layout,.big-state{grid-template-columns:1fr}.app{overflow:auto;height:auto}.screen{height:auto}.rec-button{width:220px;height:220px}.current-name{font-size:42px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">🩺</div><div><h1>主任极简听写模式</h1><p>点病人 → 开始录音 → 停止生成报告</p><div id="httpsWarn" class="https-warn">当前为 HTTP，浏览器可能禁止麦克风。请使用 https://47.109.151.238/director.html</div></div></div>
    <div class="clock"><strong id="clockTime">--:--</strong><span id="clockDate">----</span></div>
  </header>

  <main class="view">
    <section id="screenList" class="screen on">
      <div class="queue-layout">
        <div class="panel"><div class="panel-hd"><span>待检患者</span><div class="actions"><button class="btn btn-soft" id="mockBtn">生成模拟患者</button><button class="btn btn-blue" id="refreshBtn">刷新</button></div></div><div class="panel-bd"><div id="patientGrid" class="patient-grid">加载中...</div></div></div>
        <aside class="panel"><div class="panel-hd">今日概览</div><div class="panel-bd"><div class="side-stat"><div class="stat"><label>待检人数</label><div id="statWaiting">--</div></div><div class="stat"><label>操作步骤</label><div style="font-size:20px;line-height:1.8">1 选患者<br>2 开始录音<br>3 停止生成</div></div><div class="stat"><label>状态</label><div id="listStatus" style="font-size:24px">等待选择</div></div></div></div></aside>
      </div>
    </section>

    <section id="screenRecord" class="screen">
      <div class="big-state">
        <div class="patient-panel"><div class="actions"><button class="btn btn-soft" id="backBtn">← 返回列表</button></div><div style="flex:1;display:flex;justify-content:center;flex-direction:column"><div class="current-name" id="currentName">-</div><div class="current-meta" id="currentMeta">-</div><div class="p-tag" id="currentTag">已缴费</div></div></div>
        <div class="record-panel"><div class="record-center"><button id="recordBtn" class="rec-button">🎤<br>开始录音</button><div id="timer" class="timer">00:00</div><div id="wave" class="wave" style="display:none"><span></span><span></span><span></span><span></span><span></span><span></span></div><div id="recordHint" style="margin-top:18px;font-size:20px;color:var(--muted)">请点击开始录音</div></div></div>
      </div>
    </section>

    <section id="screenProcess" class="screen"><div class="process"><div class="spinner"></div><h2 id="processTitle">正在生成报告</h2><p id="processText">保存音频 → ASR识别 → 合并文本 → 生成报告</p></div></section>
    <section id="screenDone" class="screen"><div class="process"><div class="done-icon">✅</div><h2>报告已生成</h2><p id="doneText">2秒后自动回到患者列表</p></div></section>
  </main>
</div>
<div id="reviewOverlay" class="review" style="display:none"></div>
<div id="toast" class="toast"></div>
<script src="/director.js?v=20260609"></script>
</body>
</html>
