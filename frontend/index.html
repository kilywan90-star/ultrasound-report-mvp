<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>超声报告语音结构化</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#f1f5f9;color:#0f172a;height:100vh;display:flex;flex-direction:column}
.bar{background:#2563eb;color:white;padding:8px 16px;font-size:14px;display:flex;justify-content:space-between;flex-shrink:0}
.app{display:flex;flex:1;overflow:hidden}
.side{width:240px;background:white;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.side h3{padding:10px 12px;font-size:13px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.qa{padding:8px;border-bottom:1px solid #e2e8f0}
.qa input,.qa select{padding:4px 6px;border:1px solid #e2e8f0;border-radius:4px;font-size:12px;width:100%;margin-bottom:4px}
.qa .row{display:flex;gap:3px;margin-bottom:3px}
.qa .row:last-child{margin-bottom:0}
.qa button{padding:4px 10px;border:none;border-radius:4px;background:#2563eb;color:white;font-size:11px;cursor:pointer;white-space:nowrap}
.plist{flex:1;overflow-y:auto}
.pi{padding:8px 10px;border-bottom:1px solid #e2e8f0;cursor:pointer;font-size:12px;border-left:3px solid transparent}
.pi:hover{background:#f8fafc}
.pi.on{background:#eff6ff;border-left-color:#2563eb}
.pi .n{font-weight:600}.pi .e{color:#2563eb;font-size:11px}.pi .s{font-size:9px;color:#64748b}
.main{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.pn{background:white;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
.pn h4{padding:8px 12px;background:#f8fafc;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0}
.pn .b{padding:10px;display:block}
.pn.coll .b{display:none}
.rec-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rec-btn{width:50px;height:50px;border-radius:50%;border:3px solid #dc2626;background:white;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rec-btn.on{border-color:red;animation:pulse 1.5s infinite;background:#fef2f2}
.rec-btn .dot{width:18px;height:18px;border-radius:50%;background:#dc2626}.rec-btn.on .dot{border-radius:3px;width:12px;height:12px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.tag{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:500}
.tag.idle{background:#f1f5f9;color:#64748b}.tag.on{background:#fef2f2;color:#dc2626}.tag.ok{background:#f0fdf4;color:#16a34a}
textarea.txt{width:100%;min-height:60px;max-height:140px;padding:6px;border:1px solid #e2e8f0;border-radius:4px;font-size:12px;resize:vertical;font-family:inherit;background:#fafbfc}
textarea.txt:focus{outline:none;border-color:#2563eb}
.ed{width:100%;min-height:80px;max-height:280px;padding:6px;border:1px solid #e2e8f0;border-radius:4px;font-size:12px;line-height:1.7;overflow-y:auto;background:#fafbfc}
.ed:focus{outline:none;border-color:#2563eb}
.rpt-html b.vc,.rpt-html b.voice{color:#16a34a;background:#f0fdf4;padding:0 3px;border-radius:2px;font-weight:700}.rpt-html b.unfill,.rpt-html b.uf,.rpt-html i.unfill{color:#92400e;font-weight:700;border-bottom:2px solid #d97706;background:#fffbeb;padding:0 3px;border-radius:2px;font-style:normal}
.rpt-sec{margin:10px 0;padding:6px 0;border-bottom:1px solid #f1f5f9}
.rpt-sec:last-child{border-bottom:none}
.rpt-label{color:#1e40af;font-size:13px;display:block;margin-bottom:4px}
.cards{display:flex;flex-wrap:wrap;gap:4px}
.hcard{border:1px solid #e2e8f0;border-radius:4px;padding:6px 8px;min-width:180px;flex:1;max-width:280px;background:#f8fafc;border-left:3px solid #16a34a}
.hcard.off{opacity:.3;border-left-color:#dc2626}
.hcard .hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;font-size:11px}
.btn-del{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #dc2626;color:#dc2626;background:white;cursor:pointer}.btn-del:hover{background:#dc2626;color:white}
.btn-res{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #2563eb;color:#2563eb;background:white;cursor:pointer;display:none}.btn-res:hover{background:#2563eb;color:white}
.btns{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.btn{padding:5px 10px;border-radius:4px;border:1px solid #e2e8f0;background:white;cursor:pointer;font-size:11px}.btn:hover{background:#f1f5f9}
.btn-p{background:#2563eb;color:white;border-color:#2563eb}.btn-p:hover{background:#1d4ed8}
.btn-d{background:#dc2626;color:white;border-color:#dc2626}.btn-d:hover{background:#b91c1c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.preview{font-size:11px;line-height:1.6;padding:10px;border:1px solid #e2e8f0;border-radius:4px;background:#fafbfc;min-height:80px;max-height:260px;overflow-y:auto}
.toasts{position:fixed;bottom:14px;right:14px}
.toast{padding:6px 14px;border-radius:4px;color:white;font-size:11px;margin-top:3px;animation:su .3s ease}
.toast.e{background:#dc2626}.toast.s{background:#16a34a}
@keyframes su{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="bar"><span>超声报告语音结构化</span><span style="font-size:10px">Ctrl+R录音 Ctrl+S保存 Ctrl+Enter发送</span></div>

<div class="app">
<aside class="side">
  <h3>患者队列</h3>
  <div class="qa">
    <div class="row"><input id="qn" placeholder="姓名" style="flex:1"><select id="qg" style="width:46px"><option value="">性</option><option value="男">男</option><option value="女">女</option></select><input id="qa" placeholder="年龄" type="number" min="1" max="200" style="width:44px"></div>
    <div class="row"><input id="qe" placeholder="检查类型（腹部超声）" style="flex:1"><button onclick="addPt()">入队</button></div>
  </div>
  <div class="plist" id="pl"></div>
</aside>

<main class="main">
  <div style="padding:5px 10px;background:#eff6ff;border-radius:4px;font-size:12px;display:none" id="cp"></div>

  <div class="pn" id="pn1">
    <h4 onclick="toggleP('pn1')">1 语音录入 <span class="tag idle" id="st">就绪</span></h4>
    <div class="b">
      <div class="rec-row"><button class="rec-btn" id="rb" onclick="toggleRec()"><div class="dot"></div></button><span style="font-size:11px;color:#64748b">点击录音，口述超声所见</span><span id="tm" style="font-size:16px;font-weight:500">00:00</span></div>
      <div class="btns"><button class="btn" id="pb" onclick="togglePause()" disabled>暂停</button><button class="btn btn-p" id="tb" onclick="doTrans()" disabled>转写语音</button><button class="btn btn-p" id="sb" onclick="doStruct()" disabled>结构化提取</button></div>
    </div>
  </div>

  <div class="pn coll" id="pn2">
    <h4 onclick="toggleP('pn2')">2 识别文本</h4>
    <div class="b"><textarea class="txt" id="rt" placeholder="语音识别文本显示在此处..."></textarea></div>
  </div>

  <div class="pn coll" id="pn3">
    <h4 onclick="toggleP('pn3')">3 结构化报告 — 逐条审核 <span style="font-size:10px;color:#64748b">保留 <b style="color:#16a34a" id="kc">0</b> 条</span></h4>
    <div class="b">
      <label style="font-size:11px;font-weight:600;color:#64748b">超声所见（可直接编辑）:</label>
      <div class="ed" contenteditable="true" id="se"></div>
      <div style="margin-top:6px"><h4 style="font-size:11px;color:#2563eb;margin-bottom:3px">超声提示（可删除/恢复）</h4><div class="cards" id="hc"></div></div>
      <label style="font-size:11px;color:#64748b">建议:</label><div contenteditable="true" id="rc" style="font-size:11px;padding:4px;border:1px solid #e2e8f0;border-radius:4px;margin-top:2px;min-height:28px"></div>
      <div class="btns"><button class="btn btn-p" onclick="doSave()" id="svb" disabled>保存草稿</button><button class="btn btn-d" onclick="doSend()" id="sdb" disabled>发送至PACS</button></div>
    </div>
  </div>

  <div class="pn coll" id="pn4">
    <h4 onclick="toggleP('pn4')">4 报告预览</h4>
    <div class="b"><div class="preview" id="pv"><p style="color:#64748b;text-align:center;padding:20px">完成结构化后显示</p></div></div>
  </div>
</main>
</div>

<div class="toasts" id="toasts"></div>

<script>
var S={sel:null,dels:new Set(),rpt:null,ac:[],ab:null,rec:false,recog:null,paused:false,mr:null,rs:0,pe:0,ti:null};

// ==================== 患者 ====================
async function lq(){try{var r=await fetch('/api/patients/queue');var d=await r.json();rl(d.patients||[])}catch(e){}}
function rl(pts){
  var el=document.getElementById('pl');
  if(!pts.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#64748b;font-size:11px">暂无等候患者</div>';return}
  el.innerHTML=pts.map(function(p){
    var a=S.sel&&S.sel.id===p.id?' on':'';var st=p.status||'等候';var sc=st==='已完成'?'bdg-d':'bdg-w';
    return '<div class="pi'+a+'" onclick="sp('+p.id+')"><div><span class="n">'+e(p.name)+'</span> '+e(p.gender)+' '+p.age+'岁<span class="tag" style="background:'+(st==='已完成'?'#d1fae5':'#dbeafe')+';color:'+(st==='已完成'?'#065f46':'#1e40af')+';font-size:9px;margin-left:3px">'+st+'</span></div><div class="e">'+e(p.exam_type)+(p.exam_part?' / '+e(p.exam_part):'')+'</div></div>'
  }).join('')}
function addPt(){var n=document.getElementById('qn').value.trim(),g=document.getElementById('qg').value,a=parseInt(document.getElementById('qa').value),e=document.getElementById('qe').value.trim();if(!n||!g||!a||!e){t('请填写完整','e');return}
  fetch('/api/patients/quick-add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,gender:g,age:a,exam_type:e})}).then(function(r){return r.json()}).then(function(d){if(!d.success){t(d.detail,'e');return}document.getElementById('qn').value='';document.getElementById('qa').value='';document.getElementById('qe').value='';lq();sp(d.patient.id);t('已添加: '+n,'s')}).catch(function(e){t(e.message,'e')})}
function sp(id){fetch('/api/patients/queue').then(function(r){return r.json()}).then(function(d){var p=d.patients.find(function(x){return x.id===id});if(!p)return;S.sel=p;lq();var cp=document.getElementById('cp');cp.style.display='';cp.innerHTML='<b>'+e(p.name)+'</b> '+e(p.gender)+' '+p.age+'岁 — '+e(p.exam_type);rs()}).catch(function(){})}
function rs(){S.dels=new Set();S.rpt=null;S.ac=[];S.ab=null;document.getElementById('rt').value='';document.getElementById('sb').disabled=true;document.getElementById('svb').disabled=true;document.getElementById('sdb').disabled=true;document.getElementById('hc').innerHTML='';document.getElementById('se').innerHTML='';document.getElementById('rc').textContent='';document.getElementById('pv').innerHTML='<p style=\"color:#64748b;text-align:center;padding:20px\">完成结构化后显示</p>';document.getElementById('kc').textContent='0'}
function done(){if(!S.sel)return;fetch('/api/patients/'+S.sel.id+'/status?status=已完成',{method:'PUT'}).catch(function(){});lq()}

// ==================== 录音 ====================
function toggleRec(){if(!S.sel){t('请先选择患者','e');return}
  if(S.rec){stopRec();return}
  var R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){t('请使用Chrome打开','e');return}
  S.recog=new R();S.recog.lang='zh-CN';S.recog.continuous=true;S.recog.interimResults=true;
  var final='';
  S.recog.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++){var x=e.results[i][0].transcript;if(e.results[i].isFinal){final+=x}else{t+=x}}document.getElementById('rt').value=final+(t?' ['+t+']':'')};
  S.recog.onerror=function(e){t('语音错误: '+e.error,'e');S.rec=false;document.getElementById('rb').classList.remove('on');setSt('idle')};
  S.recog.onend=function(){if(S.rec){try{S.recog.start()}catch(e){}return}document.getElementById('rt').value=final;document.getElementById('sb').disabled=false;S.rec=false;document.getElementById('rb').classList.remove('on');setSt('k','完成');toggleP('pn2')};
  S.recog.start();S.rec=true;document.getElementById('rb').classList.add('on');setSt('o','录音中')}
function stopRec(){if(S.recog){S.recog.stop();S.recog=null}S.rec=false;document.getElementById('rb').classList.remove('on');document.getElementById('pb').disabled=true}
function startRec(){}
function sit(){ut();S.ti=setInterval(ut,200)}
function stt(){if(S.ti){clearInterval(S.ti);S.ti=null}}
function ut(){var ms=S.paused?S.pe:Date.now()-S.rs;document.getElementById('tm').textContent=fmt(ms)}
function fmt(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setSt(s,txt){var el=document.getElementById('st');el.className='tag '+s;el.textContent=txt||(s==='o'?'录音中':s==='k'?'完成':'就绪')}

// ==================== 转写 ====================
// ==================== 转写 (云端模式自动完成无需此按钮) ====================
function doTrans(){
  if(S.recog){t('语音已自动识别完成，直接点击结构化', 's'); return;}
  if(!S.ab){t('请先录音','e');return}
  cvt(S.ab).then(function(wav){var fd=new FormData();fd.append('file',wav,'recording.wav');return fetch('/api/transcribe',{method:'POST',body:fd})}).then(function(r){return r.json()}).then(function(d){if(!d.success){t(d.detail||'转写失败','e');setSt('k');document.getElementById('tb').disabled=false;return}document.getElementById('rt').value=d.text;document.getElementById('sb').disabled=false;setSt('k','转写完成');toggleP('pn2')}).catch(function(e){t('转写失败，请重试','e');setSt('idle');document.getElementById('tb').disabled=false})}
function cvt(blob){return blob.arrayBuffer().then(function(ab){var ctx=new AudioContext({sampleRate:16000});return ctx.decodeAudioData(ab).then(function(buf){ctx.close();var octx=new OfflineAudioContext(1,buf.duration*16000,16000);var src=octx.createBufferSource();src.buffer=buf;src.connect(octx.destination);src.start();return octx.startRendering().then(function(rs){var ch=rs.getChannelData(0);var ns=ch.length;var wb=new ArrayBuffer(44+ns*2);var v=new DataView(wb);function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}ws(0,'RIFF');v.setUint32(4,36+ns*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,ns*2,true);var o=44;for(var i=0;i<ns;i++){var s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2}return new Blob([wb],{type:'audio/wav'})})})})}

// ==================== 结构化 ====================
function doStruct(){var text=document.getElementById('rt').value.trim();if(!text){t('请先转写','e');return}if(!S.sel){t('请先选择患者','e');return}
  setSt('o','提取中...');document.getElementById('sb').disabled=true;
  fetch('/api/structure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,exam_type:S.sel.exam_type,patient_id:String(S.sel.id)})}).then(function(r){return r.json()}).then(function(d){if(!d.success){t(d.detail||'失败','e');setSt('idle');document.getElementById('sb').disabled=false;return}
    S.rpt=d.report;S.dels=new Set();document.getElementById('se').innerHTML=d.report.study_see||'';renderHints(d.report);
    document.getElementById('rc').textContent=d.report.recommendation||'';up();ukc();
    document.getElementById('svb').disabled=false;document.getElementById('sdb').disabled=false;
    setSt('k','完成');document.getElementById('sb').disabled=false;toggleP('pn2');toggleP('pn3')
  }).catch(function(e){t('结构化失败','e');setSt('idle');document.getElementById('sb').disabled=false})}
function renderHints(rpt){var hc=document.getElementById('hc');hc.innerHTML='';(rpt.study_hint||[]).forEach(function(h,i){var d=document.createElement('div');d.className='hcard';d.innerHTML='<div class="hh"><span style="font-weight:600;color:#2563eb">'+h.rank+'. '+e(h.diagnosis||'')+'</span><span style="font-size:9px;color:#64748b">'+(h.icd10?e(h.icd10):'')+'</span><button class="btn-del" onclick="dh(this,\''+h.id+'\')">✕ 删除</button><button class="btn-res" onclick="eh(this,\''+h.id+'\')">↩ 恢复</button></div>';hc.appendChild(d)})}
function dh(btn,id){S.dels.add(id);btn.closest('.hcard').classList.add('off');btn.style.display='none';btn.nextElementSibling.style.display='inline-block';up();ukc()}
function eh(btn,id){S.dels.delete(id);btn.closest('.hcard').classList.remove('off');btn.style.display='none';btn.previousElementSibling.style.display='';up();ukc()}
function ukc(){var t=(S.rpt?S.rpt.study_hint||[]:[]).length;document.getElementById('kc').textContent=t-S.dels.size}
function up(){var pv=document.getElementById('pv');var see=document.getElementById('se').innerText.trim();var hints=(S.rpt?S.rpt.study_hint||[]:[]).filter(function(h){return !S.dels.has(h.id)});var rec=document.getElementById('rc').textContent.trim();
  if(!see&&!hints.length){pv.innerHTML='<p style=\"color:#64748b;text-align:center;padding:20px\">内容为空</p>';return}
  var h='<div style=\"font-weight:600;color:#2563eb;margin:6px 0 3px;border-bottom:1px solid #e2e8f0;font-size:12px\">超声所见</div><pre style=\"white-space:pre-wrap;font-family:inherit;line-height:1.7;margin:0\">'+e(see)+'</pre>';
  if(hints.length){h+='<div style=\"font-weight:600;color:#2563eb;margin:8px 0 3px;border-bottom:1px solid #e2e8f0;font-size:12px\">超声提示</div>';hints.forEach(function(x){h+='<div style=\"margin:3px 0;padding:3px 6px;background:white;border-radius:3px\"><b>'+x.rank+'.</b> '+e(x.diagnosis||'')+' '+(x.icd10?'<span style=\"color:#64748b;font-size:10px\">('+e(x.icd10)+')</span>':'')+'</div>'})}
  if(rec)h+='<div style=\"font-weight:600;color:#2563eb;margin:8px 0 3px;border-bottom:1px solid #e2e8f0;font-size:12px\">建议</div><p>'+e(rec)+'</p>';pv.innerHTML=h}

// ==================== 保存/发送 ====================
function br(){return{study_see:document.getElementById('se').innerText.trim(),study_hint:(S.rpt?S.rpt.study_hint||[]:[]).filter(function(h){return !S.dels.has(h.id)}).map(function(h){return{rank:h.rank,diagnosis:h.diagnosis,icd10:h.icd10}}),recommendation:document.getElementById('rc').textContent.trim()}}
function doSave(){if(!S.rpt){t('请先完成结构化','e');return}localStorage['rpt_'+S.sel.id]=JSON.stringify(br());t('已保存草稿，可继续修改','s')}
function doSend(){if(!S.rpt){t('请先完成结构化','e');return}if(!confirm('确认发送至PACS？发送后不可修改。'))return;doSave();done();document.getElementById('sdb').disabled=true;document.getElementById('svb').disabled=true;t('已发送至PACS','s')}

// ==================== 工具 ====================
function toggleP(id){document.getElementById(id).classList.toggle('coll')}
function e(s){if(s===null||s===undefined)return'';return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function t(m,c){var ct=document.getElementById('toasts');var d=document.createElement('div');d.className='toast '+(c||'s');d.textContent=m;ct.appendChild(d);setTimeout(function(){d.remove()},3500)}
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='r'){e.preventDefault();toggleRec()}if(e.ctrlKey&&e.key==='s'){e.preventDefault();doSave()}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doSend()}if(e.key==='Escape'){e.preventDefault();if(S.sel)rs()}})
lq();document.getElementById('qn').focus()
</script>
</body>
</html>
