<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超声报告语音结构化 v0.3</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--danger:#dc2626;--danger-light:#fef2f2;
  --success:#16a34a;--success-light:#f0fdf4;--warn:#f59e0b;--warn-light:#fffbeb;
  --bg:#f1f5f9;--surface:#ffffff;--border:#e2e8f0;--text:#0f172a;
  --text-secondary:#64748b;--text-muted:#94a3b8;--radius:6px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;height:100vh;display:flex;flex-direction:column;
}

/* ===== Top Bar ===== */
.top-bar{
  background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:white;
  padding:8px 20px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);flex-shrink:0;
}
.top-bar h1{font-size:15px;font-weight:600}
.top-bar .meta{font-size:11px;opacity:.8}
.top-bar kbd{background:rgba(255,255,255,.15);border-radius:3px;padding:1px 5px;font-size:10px;margin:0 2px;}

/* ===== App layout: sidebar + main ===== */
.app{display:flex;flex:1;overflow:hidden}

/* ===== Left Sidebar ===== */
.sidebar{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-header{padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);background:#f8fafc;flex-shrink:0}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}

/* Quick add */
.quick-add{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.quick-add input,.quick-add select{padding:5px 7px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;font-family:inherit;outline:none;width:100%;margin-bottom:4px}
.quick-add input:focus,.quick-add select:focus{border-color:var(--primary)}
.quick-add .row{display:flex;gap:4px;margin-bottom:4px}
.quick-add .row:last-child{margin-bottom:0}
.btn-sm{padding:4px 10px;border-radius:var(--radius);border:none;cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;transition:all .15s}
.btn-sm-primary{background:var(--primary);color:white}.btn-sm-primary:hover{background:#1d4ed8}
.btn-sm-warn{background:var(--warn);color:white}

/* Patient list */
.patient-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-left:3px solid transparent}
.patient-item:hover{background:#f8fafc}
.patient-item.active{background:var(--primary-light);border-left-color:var(--primary)}
.patient-item .pi-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.patient-item .pi-name{font-weight:600;font-size:13px}
.patient-item .pi-meta{font-size:11px;color:var(--text-secondary)}
.patient-item .pi-exam{font-size:11px;color:var(--primary);margin-top:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:500}
.badge-paid{background:#dbeafe;color:#1e40af}.badge-examining{background:#fef3c7;color:#92400e}.badge-done{background:#d1fae5;color:#065f46}
.empty-queue{text-align:center;padding:30px 10px;color:var(--text-muted);font-size:12px}

/* Current patient info */
.current-pt{padding:8px 14px;background:var(--primary-light);border-bottom:1px solid var(--border);font-size:12px;flex-shrink:0}
.current-pt strong{color:var(--primary)}

/* ===== Main area ===== */
.main{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden}
.panel-header{padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;cursor:pointer}
.panel-header .panel-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--primary);color:white;align-items:center;justify-content:center;font-size:10px;margin-right:6px}
.panel-body{padding:10px}
.collapsed .panel-body{display:none}
.collapsed .panel-header{border-bottom:none}

/* Audio */
.audio-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.record-btn{width:56px;height:56px;border-radius:50%;border:3px solid var(--danger);background:white;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.record-btn:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(220,38,38,.25)}
.record-btn.recording{border-color:#f00;animation:pulse 1.5s ease-in-out infinite;background:#fef2f2}
.record-btn.paused{border-color:var(--warn);animation:none;background:var(--warn-light)}
.record-btn .icon{width:22px;height:22px;border-radius:50%;background:var(--danger);transition:all .2s}
.record-btn.recording .icon{border-radius:4px;width:14px;height:14px}
.record-btn.paused .icon{border-radius:0;width:4px;height:14px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.audio-info{font-size:11px;color:var(--text-secondary);flex:1}
.audio-info .timer{font-size:20px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.waveform{width:100%;height:36px;border-radius:var(--radius);background:#f1f5f9;margin-top:4px}
.audio-player{display:flex;align-items:center;gap:6px;margin-top:4px}
.audio-player progress{flex:1;height:5px;border-radius:3px}
.audio-player progress::-webkit-progress-bar{background:#e2e8f0;border-radius:3px}
.audio-player progress::-webkit-progress-value{background:var(--primary);border-radius:3px}
.btn-icon{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.btn-icon:hover{background:#f1f5f9;border-color:var(--primary)}
.action-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btn{padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;font-family:inherit}
.btn:hover{background:#f1f5f9}
.btn-primary{background:var(--primary);color:white;border-color:var(--primary)}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:var(--danger);color:white;border-color:var(--danger)}.btn-danger:hover{background:#b91c1c}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Raw text */
.raw-text{width:100%;min-height:70px;max-height:130px;padding:7px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;line-height:1.6;resize:vertical;font-family:inherit;background:#fafbfc}
.raw-text:focus{outline:none;border-color:var(--primary)}

/* Cards */
.card-grid{display:flex;flex-wrap:wrap;gap:6px}
.finding-card,.impression-card{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-width:220px;flex:1;max-width:340px;position:relative;transition:all .2s}
.finding-card{border-left:3px solid var(--success);background:#f8fafc}
.finding-card.deleted{display:none}
.finding-card .card-header,.impression-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.finding-card .card-title{font-weight:600;font-size:12px;color:var(--primary)}
.finding-card .card-body{font-size:11px;color:var(--text-secondary);line-height:1.5}
.finding-card .card-body .kv{margin:1px 0}
.finding-card .card-body .kv strong{color:var(--text)}
.impression-card .rank{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--primary);color:white;align-items:center;justify-content:center;font-size:9px;margin-right:4px}
.lesion-inline{display:inline-block;background:#fef2f2;border-radius:3px;padding:1px 5px;margin:1px 3px;font-size:10px;color:#991b1b}
.btn-del{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--danger);color:var(--danger);background:#fff;cursor:pointer;font-weight:600;transition:all .15s}
.btn-del:hover{background:var(--danger);color:white}
.btn-undel{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--primary);color:var(--primary);background:#fff;cursor:pointer;transition:all .15s;display:none}
.btn-undel:hover{background:var(--primary);color:white}

/* Report preview */
.report-preview{font-size:12px;line-height:1.7;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:#fafbfc;min-height:100px;max-height:350px;overflow-y:auto}
.report-preview h3{font-size:13px;color:var(--primary);margin:10px 0 5px;border-bottom:1px solid var(--border);padding-bottom:3px}
.report-preview .finding-block{margin:6px 0;padding:6px;background:white;border-radius:var(--radius);border:1px solid var(--border)}
.report-preview .impression-block{margin:3px 0;padding:3px 6px;background:white;border-radius:var(--radius)}

/* Status */
.status-tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}
.status-tag.idle{background:#f1f5f9;color:var(--text-secondary)}
.status-tag.recording{background:var(--danger-light);color:var(--danger)}
.status-tag.success{background:var(--success-light);color:var(--success)}
.status-tag.error{background:var(--danger-light);color:var(--danger)}
.toast-container{position:fixed;bottom:16px;right:16px;z-index:999}
.toast{padding:8px 16px;border-radius:var(--radius);color:white;font-size:12px;margin-top:4px;animation:slideUp .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.error{background:var(--danger)}.toast.success{background:var(--success)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="top-bar">
  <h1>超声报告语音结构化</h1>
  <span class="meta">
    <kbd>Ctrl+R</kbd> 录音 <kbd>Ctrl+P</kbd> 暂停 <kbd>Ctrl+S</kbd> 保存 <kbd>Ctrl+Enter</kbd> 发送
  </span>
</div>

<!-- ===== App Body ===== -->
<div class="app">

  <!-- ===== LEFT SIDEBAR: Patient Queue ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">患者队列</div>

    <div class="quick-add">
      <div class="row">
        <input id="qiName" placeholder="姓名" maxlength="20" style="flex:1">
        <select id="qiGender" style="width:52px"><option value="">性别</option><option value="男">男</option><option value="女">女</option></select>
        <input id="qiAge" placeholder="年龄" type="number" min="0" max="200" style="width:48px">
      </div>
      <div class="row">
        <input id="qiExam" placeholder="检查类型（如：腹部超声）" style="flex:1">
        <button class="btn-sm btn-sm-primary" onclick="addPatient()">入队</button>
      </div>
    </div>

    <div class="sidebar-body" id="patientList">
      <div class="empty-queue">暂无等候患者</div>
    </div>
  </aside>

  <!-- ===== RIGHT: 4 Panels ===== -->
  <main class="main">

    <div class="current-pt" id="currentPtLabel" style="display:none"></div>

    <!-- Panel 1: Audio -->
    <div class="panel" id="panel1">
      <div class="panel-header" onclick="togglePanel('panel1')">
        <div><span class="panel-num">1</span>语音录音与回放</div>
        <span class="status-tag idle" id="statusTag">就绪</span>
      </div>
      <div class="panel-body">
        <div class="audio-controls">
          <button class="record-btn" id="recordBtn" onclick="toggleRecording()"><div class="icon"></div></button>
          <div class="audio-info">
            <div class="timer" id="timer">00:00</div>
            <span style="font-size:10px">点击或按 Ctrl+R 开始</span>
          </div>
        </div>
        <canvas class="waveform" id="waveform" width="800" height="36"></canvas>
        <div class="audio-player" id="audioPlayer" style="display:none">
          <button class="btn-icon" onclick="playAudio()" title="播放">▶</button>
          <progress id="audioProgress" value="0" max="100"></progress>
          <span style="font-size:10px;color:var(--text-muted)" id="audioTime">0:00</span>
          <button class="btn-icon" onclick="stopAudio()" title="停止">■</button>
        </div>
        <div class="action-row">
          <button class="btn" id="pauseBtn" onclick="togglePause()" disabled>暂停</button>
          <button class="btn btn-primary" id="transcribeBtn" onclick="doTranscribe()" disabled>转写语音</button>
        </div>
      </div>
    </div>

    <!-- Panel 2: Raw Transcript -->
    <div class="panel" id="panel2">
      <div class="panel-header" onclick="togglePanel('panel2')"><div><span class="panel-num">2</span>语音转写原始文本</div></div>
      <div class="panel-body">
        <textarea class="raw-text" id="rawText" placeholder="ASR识别文本将显示在此处..." readonly></textarea>
        <div class="action-row">
          <button class="btn btn-primary" id="structureBtn" onclick="doStructure()" disabled>结构化提取</button>
        </div>
      </div>
    </div>

    <!-- Panel 3: Review -->
    <div class="panel" id="panel3">
      <div class="panel-header" onclick="togglePanel('panel3')">
        <div><span class="panel-num">3</span>结构化所见 — 逐条审核</div>
        <span style="font-size:10px;color:var(--text-muted)">保留 <b style="color:var(--success)" id="keptCount">0</b> 条</span>
      </div>
      <div class="panel-body">
        <div style="margin-bottom:6px;font-size:11px;color:var(--text-secondary)">
          默认全部保留。点 <b style="color:var(--danger)">✕ 删除</b> 可从报告中移除该条。
        </div>
        <div class="card-grid" id="findingCards"></div>
        <div style="margin-top:10px"><h4 style="font-size:12px;color:var(--primary);margin-bottom:4px">超声提示</h4><div class="card-grid" id="impressionCards"></div></div>
        <div style="margin-top:10px">
          <label style="font-size:11px;color:var(--text-secondary)">建议:</label>
          <div contenteditable="true" id="recommendationEdit" style="font-size:12px;padding:5px;border:1px solid var(--border);border-radius:var(--radius);margin-top:3px;min-height:32px"></div>
        </div>
        <div class="action-row" style="margin-top:10px">
          <button class="btn btn-primary" onclick="doSave()" id="saveBtn" disabled>保存草稿</button>
          <button class="btn btn-danger" onclick="doSend()" id="sendBtn" disabled>发送至PACS</button>
        </div>
      </div>
    </div>

    <!-- Panel 4: Preview -->
    <div class="panel" id="panel4">
      <div class="panel-header" onclick="togglePanel('panel4')"><div><span class="panel-num">4</span>超声报告预览</div></div>
      <div class="panel-body">
        <div class="report-preview" id="reportPreview">
          <p style="color:var(--text-muted);text-align:center;padding:30px">完成结构化后，最终超声报告将显示在此处</p>
        </div>
      </div>
    </div>

  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== State ====================
let S = {
  selectedPatient: null, deletedIds: new Set(),
  recording: false, paused: false,
  mediaRecorder: null, audioChunks: [], audioBlob: null,
  recordingStart: 0, pausedElapsed: 0, timerInterval: null,
  audioContext: null, analyserNode: null, animationId: null,
  audioId: null, rawText: '',
  report: null, reportId: null,
  audioEl: null,
};

// ==================== Patient ====================
async function loadQueue(){
  try{
    const r=await fetch('/api/patients/queue');
    const data=await r.json();
    renderList(data.patients||[]);
  }catch(e){showToast('加载队列失败','error')}
}
function renderList(patients){
  const el=document.getElementById('patientList');
  if(!patients.length){el.innerHTML='<div class="empty-queue">暂无等候患者<br>请在左上方快速录入</div>';return}
  el.innerHTML=patients.map(p=>{
    const active=S.selectedPatient&&S.selectedPatient.id===p.id?' active':'';
    const sc=p.status==='已缴费'?'已缴费':p.status==='检查中'?'检查中':'已完成';
    const scCls=p.status==='已缴费'?'badge-paid':p.status==='检查中'?'badge-examining':'badge-done';
    return `<div class="patient-item${active}" onclick="selectPatient(${p.id})" data-id="${p.id}">
      <div class="pi-top"><span class="pi-name">${esc(p.name)}</span><span>${esc(p.gender)} ${p.age}岁</span><span class="badge ${scCls}">${sc}</span></div>
      <div class="pi-exam">${esc(p.exam_type)}${p.exam_part?' / '+esc(p.exam_part):''}</div>
      <div class="pi-meta">${p.created_at}</div>
    </div>`;
  }).join('');
}
async function addPatient(){
  const name=document.getElementById('qiName').value.trim(),gender=document.getElementById('qiGender').value;
  const age=parseInt(document.getElementById('qiAge').value),exam=document.getElementById('qiExam').value.trim();
  if(!name||!gender||!age||!exam){showToast('请填写完整信息','error');return}
  try{
    const r=await fetch('/api/patients/quick-add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,gender,age,exam_type:exam})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail);
    document.getElementById('qiName').value='';document.getElementById('qiAge').value='';document.getElementById('qiExam').value='';
    await loadQueue();selectPatient(data.patient.id);showToast('已添加: '+data.patient.name,'success');
  }catch(e){showToast(e.message,'error')}
}
async function selectPatient(id){
  try{
    const r=await fetch('/api/patients/queue');const data=await r.json();
    const p=data.patients.find(x=>x.id===id);if(!p)return;
    S.selectedPatient=p;renderList(data.patients);
    document.getElementById('currentPtLabel').style.display='';
    document.getElementById('currentPtLabel').innerHTML=`<strong>${esc(p.name)}</strong> ${esc(p.gender)} ${p.age}岁 — ${esc(p.exam_type)}`;
    resetWorkspace();
  }catch(e){showToast('选择失败','error')}
}
function resetWorkspace(){
  S.audioBlob=null;S.audioId=null;S.rawText='';S.report=null;S.reportId=null;S.deletedIds=new Set();
  document.getElementById('rawText').value='';
  document.getElementById('structureBtn').disabled=true;
  document.getElementById('saveBtn').disabled=true;document.getElementById('sendBtn').disabled=true;
  document.getElementById('findingCards').innerHTML='';document.getElementById('impressionCards').innerHTML='';
  document.getElementById('recommendationEdit').textContent='';
  document.getElementById('reportPreview').innerHTML='<p style="color:var(--text-muted);text-align:center;padding:30px">完成结构化后，最终超声报告将显示在此处</p>';
  document.getElementById('audioPlayer').style.display='none';
  document.getElementById('transcribeBtn').disabled=true;document.getElementById('keptCount').textContent='0';
  if(S.audioEl){S.audioEl.pause();S.audioEl=null}
  document.getElementById('timer').textContent='00:00';setStatus('idle');
}

// ==================== Recording ====================
async function toggleRecording(){if(S.recording){stopRecording();return}if(!S.selectedPatient){showToast('请先选择患者','error');return}await startRecording()}
async function startRecording(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:true,noiseSuppression:true}});
    S.audioContext=new AudioContext({sampleRate:16000});const src=S.audioContext.createMediaStreamSource(stream);
    S.analyserNode=S.audioContext.createAnalyser();S.analyserNode.fftSize=256;src.connect(S.analyserNode);
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
    S.mediaRecorder=new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:32000});S.audioChunks=[];
    S.mediaRecorder.ondataavailable=e=>{if(e.data.size>0)S.audioChunks.push(e.data)};
    S.mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());if(S.audioContext){S.audioContext.close();S.audioContext=null}stopWaveform();S.audioBlob=new Blob(S.audioChunks,{type:mime});await uploadAudioForPlayback(S.audioBlob);document.getElementById('transcribeBtn').disabled=false;setStatus('success','可转写')};
    S.mediaRecorder.start(250);S.recording=true;S.paused=false;S.recordingStart=Date.now();S.pausedElapsed=0;startTimer();startWaveform();
    document.getElementById('recordBtn').classList.add('recording');document.getElementById('pauseBtn').disabled=false;document.getElementById('pauseBtn').textContent='暂停';setStatus('recording');
  }catch(e){showToast('麦克风错误: '+e.message,'error')}
}
function stopRecording(){if(S.mediaRecorder&&S.mediaRecorder.state==='recording')S.mediaRecorder.stop();S.recording=false;S.paused=false;document.getElementById('recordBtn').classList.remove('recording','paused');document.getElementById('pauseBtn').disabled=true;document.getElementById('pauseBtn').textContent='暂停';stopTimer()}
function togglePause(){
  if(!S.recording)return;
  if(S.paused){S.mediaRecorder.resume();S.paused=false;S.recordingStart=Date.now()-S.pausedElapsed;startTimer();startWaveform();document.getElementById('recordBtn').classList.add('recording');document.getElementById('recordBtn').classList.remove('paused');document.getElementById('pauseBtn').textContent='暂停';setStatus('recording')}
  else{S.mediaRecorder.pause();S.paused=true;S.pausedElapsed=Date.now()-S.recordingStart;stopTimer();document.getElementById('timer').textContent=fmtTime(S.pausedElapsed);stopWaveform();document.getElementById('recordBtn').classList.remove('recording');document.getElementById('recordBtn').classList.add('paused');document.getElementById('pauseBtn').textContent='继续';setStatus('paused')}
}

// ==================== Audio ====================
async function uploadAudioForPlayback(blob){try{const fd=new FormData();fd.append('file',blob,'recording.webm');const r=await fetch('/api/audio/upload',{method:'POST',body:fd});const data=await r.json();if(r.ok&&data.success)S.audioId=data.audio_id}catch(e){}}
function playAudio(){if(!S.audioId)return;if(!S.audioEl){S.audioEl=new Audio('/api/audio/'+S.audioId);S.audioEl.ontimeupdate=()=>{const pct=S.audioEl.duration?(S.audioEl.currentTime/S.audioEl.duration*100):0;document.getElementById('audioProgress').value=pct;document.getElementById('audioTime').textContent=fmtTime(S.audioEl.currentTime*1000)};S.audioEl.onended=()=>stopAudio()}S.audioEl.play();document.getElementById('audioPlayer').style.display='flex'}
function stopAudio(){if(S.audioEl){S.audioEl.pause();S.audioEl.currentTime=0}document.getElementById('audioProgress').value=0;document.getElementById('audioTime').textContent='0:00'}

// ==================== Transcribe ====================
async function doTranscribe(){
  if(!S.audioBlob){showToast('请先录音','error');return}
  setStatus('processing','转写中...');document.getElementById('transcribeBtn').disabled=true;
  try{
    const wav=await convertToWav(S.audioBlob);const fd=new FormData();fd.append('file',wav,'recording.wav');
    const r=await fetch('/api/transcribe',{method:'POST',body:fd});const data=await r.json();
    if(!r.ok)throw new Error(data.detail||'转写失败');
    S.rawText=data.text;document.getElementById('rawText').value=data.text;document.getElementById('structureBtn').disabled=false;
    setStatus('success','转写完成');openPanel('panel2');
  }catch(e){setStatus('error');showToast(e.message,'error');document.getElementById('transcribeBtn').disabled=false}
}
async function convertToWav(blob){
  const ab=await blob.arrayBuffer();const actx=new AudioContext({sampleRate:16000});const buf=await actx.decodeAudioData(ab);actx.close();
  const octx=new OfflineAudioContext(1,buf.duration*16000,16000);const src=octx.createBufferSource();src.buffer=buf;src.connect(octx.destination);src.start();
  const ch=(await octx.startRendering()).getChannelData(0);const ns=ch.length;const wbuf=new ArrayBuffer(44+ns*2);const v=new DataView(wbuf);
  function ws(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  ws(0,'RIFF');v.setUint32(4,36+ns*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,ns*2,true);let o=44;
  for(let i=0;i<ns;i++){const s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2}
  return new Blob([wbuf],{type:'audio/wav'});
}

// ==================== Structure ====================
async function doStructure(){
  if(!S.rawText.trim()){showToast('请先转写语音','error');return}if(!S.selectedPatient){showToast('请先选择患者','error');return}
  setStatus('processing','结构化提取...');document.getElementById('structureBtn').disabled=true;
  try{
    const r=await fetch('/api/structure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:S.rawText,exam_type:S.selectedPatient.exam_type,patient_id:S.selectedPatient.id})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||data.warning||'结构化失败');if(data.warning)showToast(data.warning,'error');
    S.report=data.report;S.reportId=data.report_id;S.deletedIds=new Set();
    renderCards(S.report);openPanel('panel2');openPanel('panel3');setStatus('success','结构化完成');
  }catch(e){setStatus('error');showToast(e.message,'error');document.getElementById('structureBtn').disabled=false}
}

function renderCards(report){
  const fc=document.getElementById('findingCards');fc.innerHTML='';
  (report.findings||[]).forEach((f,i)=>{
    const fid=f.id;const div=document.createElement('div');
    div.className='finding-card';div.setAttribute('data-fid',fid);
    const fieldsHtml=Object.entries(f).filter(([k])=>!['organ','id','lesions'].includes(k)).map(([k,v])=>v!=null?`<div class="kv"><strong>${esc(k)}:</strong> ${esc(String(v))}</div>`:'').join('');
    const lesionsHtml=(f.lesions&&f.lesions.length)?f.lesions.map((l,j)=>`<span class="lesion-inline">病灶${j+1}: ${[l.location,l.size,l.echo,l.morphology].filter(Boolean).join('/')||'未描述'}</span>`).join(''):'';
    div.innerHTML=`<div class="card-header"><span class="card-title">${esc(f.organ||'脏器'+(i+1))}</span><button class="btn-del" onclick="deleteCard(this,'finding','${fid}')">✕ 删除</button><button class="btn-undel" onclick="undeleteCard(this,'finding','${fid}')">↩ 恢复</button></div><div class="card-body">${fieldsHtml}${lesionsHtml}</div>`;
    fc.appendChild(div);
  });
  const ic=document.getElementById('impressionCards');ic.innerHTML='';
  (report.impression||[]).forEach((imp,i)=>{
    const iid=imp.id;const div=document.createElement('div');
    div.className='impression-card';div.setAttribute('data-iid',iid);
    div.innerHTML=`<div class="card-header"><span><span class="rank">${imp.rank||i+1}</span>${esc(imp.diagnosis||'')}</span><span style="font-size:10px;color:var(--text-secondary)">${imp.icd10?esc(imp.icd10):''}</span><button class="btn-del" onclick="deleteCard(this,'impression','${iid}')">✕ 删除</button><button class="btn-undel" onclick="undeleteCard(this,'impression','${iid}')">↩ 恢复</button></div>`;
    ic.appendChild(div);
  });
  document.getElementById('recommendationEdit').textContent=report.recommendation||'';
  updateKeptCount();updatePreview();
  document.getElementById('saveBtn').disabled=false;document.getElementById('sendBtn').disabled=false;
}

// --- Delete / Undelete ---
function deleteCard(btn, type, id){
  S.deletedIds.add(id);
  const card=btn.closest('.finding-card,.impression-card');
  card.style.opacity='0.3';card.style.borderLeftColor='var(--danger)';
  btn.style.display='none';
  card.querySelector('.btn-undel').style.display='inline-block';
  updateKeptCount();updatePreview();
}
function undeleteCard(btn, type, id){
  S.deletedIds.delete(id);
  const card=btn.closest('.finding-card,.impression-card');
  card.style.opacity='1';card.style.borderLeftColor='';
  btn.style.display='none';
  card.querySelector('.btn-del').style.display='';
  updateKeptCount();updatePreview();
}

function updateKeptCount(){
  const fTotal=(S.report?.findings||[]).length;const iTotal=(S.report?.impression||[]).length;
  const total=fTotal+iTotal;const kept=total-S.deletedIds.size;
  document.getElementById('keptCount').textContent=kept;
}
function updatePreview(){
  const preview=document.getElementById('reportPreview');
  const findings=(S.report?.findings||[]).filter(f=>!S.deletedIds.has(f.id));
  const impressions=(S.report?.impression||[]).filter(i=>!S.deletedIds.has(i.id));
  if(!findings.length&&!impressions.length){preview.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:30px">所有条目已删除</p>';return}
  let html='<h3>超声所见</h3>';
  findings.forEach(f=>{
    html+=`<div class="finding-block"><b>${esc(f.organ||'')}</b><br>`;
    Object.entries(f).filter(([k])=>!['organ','id','lesions'].includes(k)).forEach(([k,v])=>{if(v!=null)html+=`${k}: ${esc(String(v))}<br>`});
    if(f.lesions&&f.lesions.length)html+=f.lesions.map((l,j)=>`<span style="color:#991b1b">病灶${j+1}: ${[l.location,l.size,l.echo,l.morphology].filter(Boolean).join('/')}</span><br>`).join('');
    html+='</div>';
  });
  html+='<h3>超声提示</h3>';
  impressions.forEach(imp=>{html+=`<div class="impression-block"><b>${imp.rank}.</b> ${esc(imp.diagnosis||'')} ${imp.icd10?'<span style="color:var(--text-muted)">('+esc(imp.icd10)+')</span>':''}</div>`});
  const rec=document.getElementById('recommendationEdit').textContent.trim();if(rec)html+=`<h3>建议</h3><p>${esc(rec)}</p>`;preview.innerHTML=html;
}

// ==================== Save / Send ====================
function _buildSendReport(){
  // Build a report with deleted items stripped
  const r=JSON.parse(JSON.stringify(S.report));
  r.findings=r.findings.filter(f=>!S.deletedIds.has(f.id));
  r.impression=r.impression.filter(i=>!S.deletedIds.has(i.id));
  r.recommendation=document.getElementById('recommendationEdit').textContent.trim();
  return r;
}
async function doSave(){
  if(!S.reportId){showToast('请先完成结构化','error');return}
  const payload=_buildSendReport();
  try{
    const r=await fetch('/api/reports/'+S.reportId+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:payload})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||'保存失败');
    showToast('报告已保存草稿，可继续修改','success');
  }catch(e){showToast(e.message,'error')}
}
async function doSend(){
  if(!S.reportId){showToast('请先完成结构化','error');return}
  if(!confirm('确认发送此报告至PACS？\n\n发送后报告将不可修改，请确认所有内容无误。'))return;
  // 发送前自动保存
  await doSave();
  const payload=_buildSendReport();
  try{
    const r=await fetch('/api/reports/'+S.reportId+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:payload})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||'发送失败');
    showToast(data.message||'已发送至PACS','success');
    document.getElementById('sendBtn').disabled=true;
    document.getElementById('saveBtn').disabled=true;
  }catch(e){showToast(e.message,'error')}
}

// ==================== UI ====================
function togglePanel(id){document.getElementById(id).classList.toggle('collapsed')}
function openPanel(id){document.getElementById(id).classList.remove('collapsed')}
function setStatus(s,text){
  const tag=document.getElementById('statusTag');tag.className='status-tag '+s;
  const labels={idle:'就绪',recording:'录音中...',paused:'已暂停',processing:'处理中...',success:'完成',error:'失败'};
  tag.textContent=text||labels[s]||s;
}
function startTimer(){updateTimer();S.timerInterval=setInterval(updateTimer,200)}
function stopTimer(){if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null}}
function updateTimer(){const ms=S.paused?S.pausedElapsed:Date.now()-S.recordingStart;document.getElementById('timer').textContent=fmtTime(ms)}
function fmtTime(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startWaveform(){
  const c=document.getElementById('waveform').getContext('2d');const bl=S.analyserNode.frequencyBinCount;const da=new Uint8Array(bl);
  function draw(){if(S.paused)return;S.animationId=requestAnimationFrame(draw);S.analyserNode.getByteTimeDomainData(da);c.fillStyle='#f1f5f9';c.fillRect(0,0,800,36);c.lineWidth=2;c.strokeStyle='#2563eb';c.beginPath();const sw=800/bl;for(let i=0;i<bl;i++){const y=(da[i]/128)*18;i===0?c.moveTo(i*sw,y):c.lineTo(i*sw,y)}c.stroke()}draw();
}
function stopWaveform(){if(S.animationId){cancelAnimationFrame(S.animationId);S.animationId=null}const c=document.getElementById('waveform');c.getContext('2d').fillStyle='#f1f5f9';c.getContext('2d').fillRect(0,0,800,36)}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='r'){e.preventDefault();toggleRecording();return}
  if(e.ctrlKey&&e.key==='p'){e.preventDefault();togglePause();return}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();doSave();return}
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doSend();return}
  if(e.key==='Escape'){e.preventDefault();resetWorkspace();return}
});

function esc(s){return s!=null?String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]):''}
function showToast(msg,type){const ct=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;ct.appendChild(t);setTimeout(()=>t.remove(),3500)}

// Init
loadQueue();document.getElementById('qiName').focus();
</script>
