<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超声报告语音结构化 v0.4</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#2563eb;--primary-light:#eff6ff;--danger:#dc2626;--danger-light:#fef2f2;--success:#16a34a;--success-light:#f0fdf4;--bg:#f1f5f9;--surface:#ffffff;--border:#e2e8f0;--text:#0f172a;--text-secondary:#64748b;--text-muted:#94a3b8;--radius:6px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;height:100vh;display:flex;flex-direction:column}
.top-bar{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:white;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-bar h1{font-size:15px;font-weight:600}
.top-bar kbd{background:rgba(255,255,255,.15);border-radius:3px;padding:1px 5px;font-size:10px;margin:0 2px}
.app{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);background:#f8fafc}
.quick-add{padding:8px;border-bottom:1px solid var(--border)}
.quick-add input,.quick-add select{padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;font-family:inherit;outline:none;width:100%;margin-bottom:3px}
.quick-add .row{display:flex;gap:3px;margin-bottom:3px}
.btn-xs{padding:3px 8px;border-radius:var(--radius);border:none;cursor:pointer;font-size:10px;font-weight:500;background:var(--primary);color:white}
.patient-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-left:3px solid transparent;font-size:12px}
.patient-item:hover{background:#f8fafc}.patient-item.active{background:var(--primary-light);border-left-color:var(--primary)}
.patient-item .pi-name{font-weight:600}.patient-item .pi-exam{color:var(--primary);font-size:11px}
.badge{display:inline-block;padding:1px 5px;border-radius:6px;font-size:9px;margin-left:4px}.badge-wait{background:#dbeafe;color:#1e40af}.badge-done{background:#d1fae5;color:#065f46}
.main{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.current-pt{padding:6px 12px;background:var(--primary-light);font-size:12px;border-radius:var(--radius)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-header{padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.panel-header .pn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--primary);color:white;align-items:center;justify-content:center;font-size:10px;margin-right:6px}
.panel-body{padding:10px}.collapsed .panel-body{display:none}
.audio-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-btn{width:56px;height:56px;border-radius:50%;border:3px solid var(--danger);background:white;cursor:pointer;transition:all .2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rec-btn:hover{transform:scale(1.05)}.rec-btn.on{border-color:#f00;animation:pulse 1.5s infinite;background:#fef2f2}
.rec-btn .dot{width:22px;height:22px;border-radius:50%;background:var(--danger)}.rec-btn.on .dot{border-radius:4px;width:14px;height:14px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.status-tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}.status-tag.idle{background:#f1f5f9;color:var(--text-secondary)}.status-tag.on{background:var(--danger-light);color:var(--danger)}.status-tag.ok{background:var(--success-light);color:var(--success)}
.raw-text{width:100%;min-height:70px;max-height:200px;padding:7px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;line-height:1.6;resize:vertical;font-family:inherit;background:#fafbfc}
.card-grid{display:flex;flex-wrap:wrap;gap:6px}
.icard{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-width:200px;flex:1;max-width:320px;transition:all .2s;background:#f8fafc;border-left:3px solid var(--success)}
.icard.del{opacity:.3;border-left-color:var(--danger)}
.icard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.rk{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--primary);color:white;align-items:center;justify-content:center;font-size:9px;margin-right:4px}
.btn-del{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--danger);color:var(--danger);background:#fff;cursor:pointer}.btn-del:hover{background:var(--danger);color:white}
.btn-res{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--primary);color:var(--primary);background:#fff;cursor:pointer;display:none}.btn-res:hover{background:var(--primary);color:white}
.action-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btn{padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:11px;font-weight:500}.btn:hover{background:#f1f5f9}
.btn-primary{background:var(--primary);color:white;border-color:var(--primary)}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:var(--danger);color:white;border-color:var(--danger)}.btn-danger:hover{background:#b91c1c}
.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{font-size:12px;line-height:1.7;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:#fafbfc;min-height:100px;max-height:300px;overflow-y:auto}
.preview h3{font-size:13px;color:var(--primary);margin:10px 0 5px;border-bottom:1px solid var(--border);padding-bottom:3px}
.toast-container{position:fixed;bottom:16px;right:16px;z-index:999}.toast{padding:8px 16px;border-radius:var(--radius);color:white;font-size:12px;margin-top:4px;animation:slideUp .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.error{background:var(--danger)}.toast.success{background:var(--success)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="top-bar"><h1>超声报告语音结构化 v0.4</h1><span style="font-size:11px;opacity:.8"><kbd>Ctrl+R</kbd> 录音 <kbd>Ctrl+S</kbd> 保存 <kbd>Ctrl+Enter</kbd> 发送</span></div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">患者队列</div>
    <div class="quick-add">
      <div class="row"><input id="qn" placeholder="姓名" maxlength="20" style="flex:1"><select id="qg" style="width:50px"><option value="">性</option><option value="男">男</option><option value="女">女</option></select><input id="qa" placeholder="年龄" type="number" min="0" max="200" style="width:46px"></div>
      <div class="row"><input id="qe" placeholder="检查类型（腹部超声）" style="flex:1"><button class="btn-xs" onclick="addPatient()">入队</button></div>
    </div>
    <div id="patientList" style="flex:1;overflow-y:auto"><div style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px">暂无等候患者</div></div>
  </aside>
  <main class="main">
    <div class="current-pt" id="curPt" style="display:none"></div>

    <div class="panel" id="p1">
      <div class="panel-header" onclick="toggleP('p1')"><div><span class="pn">1</span>语音录入 <span class="status-tag idle" id="st">就绪</span></div></div>
      <div class="panel-body">
        <div class="audio-row"><button class="rec-btn" id="recBtn" onclick="toggleRec()"><div class="dot"></div></button><div style="font-size:12px;color:var(--text-secondary)">点击开始口述超声所见</div></div>
        <div style="margin-top:6px;font-size:10px;color:var(--text-muted)">使用浏览器内置语音识别（Chrome 效果最佳）</div>
        <div class="action-row"><button class="btn btn-primary" id="structBtn" onclick="doStructure()" disabled>结构化提取</button></div>
      </div>
    </div>

    <div class="panel" id="p2">
      <div class="panel-header" onclick="toggleP('p2')"><div><span class="pn">2</span>识别文本</div></div>
      <div class="panel-body"><textarea class="raw-text" id="rawText" placeholder="语音识别文本将显示在此处..."></textarea></div>
    </div>

    <div class="panel" id="p3">
      <div class="panel-header" onclick="toggleP('p3')"><div><span class="pn">3</span>结构化报告 — 逐条审核</div><span style="font-size:10px;color:var(--text-muted)">保留 <b style="color:var(--success)" id="kc">0</b> 条诊断</span></div>
      <div class="panel-body">
        <label style="font-size:11px;color:var(--text-secondary);font-weight:600">超声所见（可直接编辑）:</label>
        <textarea class="raw-text" id="studySeeEdit" style="min-height:100px;max-height:250px" placeholder="AI 生成的超声所见文本..."></textarea>
        <div style="margin-top:10px"><h4 style="font-size:12px;color:var(--primary);margin-bottom:4px">超声提示（可删除/恢复）</h4><div class="card-grid" id="hintCards"></div></div>
        <label style="font-size:11px;color:var(--text-secondary)">建议:</label><div contenteditable="true" id="rec" style="font-size:12px;padding:5px;border:1px solid var(--border);border-radius:var(--radius);margin-top:3px;min-height:32px"></div>
        <div class="action-row" style="margin-top:8px"><button class="btn btn-primary" onclick="doSave()" id="saveBtn" disabled>保存草稿</button><button class="btn btn-danger" onclick="doSend()" id="sendBtn" disabled>发送至PACS</button></div>
      </div>
    </div>

    <div class="panel" id="p4">
      <div class="panel-header" onclick="toggleP('p4')"><div><span class="pn">4</span>报告预览</div></div>
      <div class="panel-body"><div class="preview" id="preview"><p style="color:var(--text-muted);text-align:center;padding:30px">完成结构化后显示</p></div></div>
    </div>
  </main>
</div>

<div class="toast-container" id="tc"></div>

<script>
// ==================== State ====================
let S = {sel:null, dels:new Set(), report:null, recog:null, recognizing:false, finalText:''};

// ==================== Patients (localStorage) ====================
function getPatients(){ try{ return JSON.parse(localStorage.pts||'[]'); }catch(e){return[]} }
function savePatients(pts){ localStorage.pts = JSON.stringify(pts); }
function loadQueue(){ renderList(getPatients()); }
function renderList(pts){
  const el=document.getElementById('patientList');
  if(!pts.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px">暂无等候患者</div>';return}
  el.innerHTML=pts.map(p=>{const a=S.sel&&S.sel.id===p.id?' active':'';return `<div class="patient-item${a}" onclick="selPatient('${p.id}')"><div><span class="pi-name">${esc(p.name)}</span> ${esc(p.gender)} ${p.age}岁<span class="badge ${p.status==='已完成'?'badge-done':'badge-wait'}">${p.status||'等候'}</span></div><div class="pi-exam">${esc(p.exam_type)}</div></div>`}).join('')
}
function addPatient(){const n=document.getElementById('qn').value.trim(),g=document.getElementById('qg').value,a=parseInt(document.getElementById('qa').value),e=document.getElementById('qe').value.trim();if(!n||!g||!a||!e){toast('请填写完整','error');return}const p={id:Date.now().toString(36),name:n,gender:g,age:a,exam_type:e,status:'等候'};const pts=getPatients();pts.unshift(p);savePatients(pts);document.getElementById('qn').value='';document.getElementById('qa').value='';document.getElementById('qe').value='';loadQueue();selPatient(p.id);toast('已添加: '+n,'success')}
function selPatient(id){const pts=getPatients();const p=pts.find(x=>x.id===id);if(!p)return;S.sel=p;loadQueue();document.getElementById('curPt').style.display='';document.getElementById('curPt').innerHTML=`<b>${esc(p.name)}</b> ${esc(p.gender)} ${p.age}岁 — ${esc(p.exam_type)}`;resetWs()}
function resetWs(){S.dels=new Set();S.report=null;S.finalText='';document.getElementById('rawText').value='';document.getElementById('structBtn').disabled=true;document.getElementById('saveBtn').disabled=true;document.getElementById('sendBtn').disabled=true;document.getElementById('hintCards').innerHTML='';document.getElementById('studySeeEdit').value='';document.getElementById('rec').textContent='';document.getElementById('preview').innerHTML='<p style="color:var(--text-muted);text-align:center;padding:30px">完成结构化后显示</p>';document.getElementById('kc').textContent='0'}
function markDone(){if(!S.sel)return;const pts=getPatients();const p=pts.find(x=>x.id===S.sel.id);if(p)p.status='已完成';savePatients(pts);loadQueue()}

// ==================== Speech Recognition ====================
function toggleRec(){if(S.recognizing){stopRec();return}if(!S.sel){toast('请先选择患者','error');return}startRec()}
function startRec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('请使用Chrome浏览器','error');return}S.recog=new R();S.recog.lang='zh-CN';S.recog.continuous=true;S.recog.interimResults=true;S.finalText='';S.recog.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i][0].transcript;if(e.results[i].isFinal)S.finalText+=x;else t+=x}document.getElementById('rawText').value=S.finalText+(t?' ['+t+']':'')};S.recog.onerror=e=>{toast('识别错误: '+e.error,'error');stopRec()};S.recog.onend=()=>{if(S.recognizing){try{S.recog.start()}catch(e){}return}document.getElementById('rawText').value=S.finalText;document.getElementById('structBtn').disabled=!S.finalText.trim();setStatus('idle')};S.recog.start();S.recognizing=true;document.getElementById('recBtn').classList.add('on');setStatus('on','录音中')}
function stopRec(){S.recognizing=false;if(S.recog)S.recog.stop();document.getElementById('recBtn').classList.remove('on');document.getElementById('rawText').value=S.finalText;document.getElementById('structBtn').disabled=!S.finalText.trim();setStatus('idle')}
function setStatus(s,t){const el=document.getElementById('st');el.className='status-tag '+s;el.textContent=t||(s==='on'?'录音中':'就绪')}

// ==================== Structure ====================
async function doStructure(){
  const text=document.getElementById('rawText').value.trim();if(!text){toast('请先完成语音识别','error');return}if(!S.sel){toast('请先选择患者','error');return}
  setStatus('on','结构化提取中...');document.getElementById('structBtn').disabled=true;
  try{
    const r=await fetch('/api/structure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,exam_type:S.sel.exam_type,patient_id:S.sel.id})});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||d.warning||'结构化失败');if(d.warning)toast(d.warning,'error');
    S.report=d.report;S.dels=new Set();
    document.getElementById('studySeeEdit').value=d.report.study_see||'';
    renderHints(d.report);
    document.getElementById('rec').textContent=d.report.recommendation||'';
    updatePreview();updateKc();
    document.getElementById('saveBtn').disabled=false;document.getElementById('sendBtn').disabled=false;
    setStatus('ok','完成');document.getElementById('structBtn').disabled=false;
  }catch(e){setStatus('idle');document.getElementById('structBtn').disabled=false;toast(e.message,'error')}
}

function renderHints(report){
  const hc=document.getElementById('hintCards');hc.innerHTML='';
  (report.study_hint||[]).forEach((h,i)=>{
    const div=document.createElement('div');div.className='icard';div.setAttribute('data-hid',h.id);
    div.innerHTML=`<div class="ch"><span><span class="rk">${h.rank||i+1}</span>${esc(h.diagnosis||'')}</span><span style="font-size:10px;color:var(--text-secondary);margin-left:4px">${h.icd10?esc(h.icd10):''}</span><button class="btn-del" onclick="delHint(this,'${h.id}')">✕ 删除</button><button class="btn-res" onclick="resHint(this,'${h.id}')">↩ 恢复</button></div>`;
    hc.appendChild(div);
  });
}
function delHint(btn,id){S.dels.add(id);const c=btn.closest('.icard');c.classList.add('del');btn.style.display='none';btn.nextElementSibling.style.display='inline-block';updatePreview();updateKc()}
function resHint(btn,id){S.dels.delete(id);const c=btn.closest('.icard');c.classList.remove('del');btn.style.display='none';btn.previousElementSibling.style.display='';updatePreview();updateKc()}
function updateKc(){const t=(S.report?.study_hint||[]).length;document.getElementById('kc').textContent=t-S.dels.size}
function updatePreview(){
  const pv=document.getElementById('preview');
  const see=document.getElementById('studySeeEdit').value.trim();
  const hints=(S.report?.study_hint||[]).filter(h=>!S.dels.has(h.id));
  const rec=document.getElementById('rec').textContent.trim();
  if(!see&&!hints.length){pv.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:30px">内容为空</p>';return}
  let h='<h3>超声所见</h3><div style="white-space:pre-wrap;line-height:1.8">'+esc(see)+'</div>';
  if(hints.length){h+='<h3>超声提示</h3>';hints.forEach(x=>h+=`<div style="margin:3px 0;padding:3px 6px;background:white;border-radius:var(--radius)"><b>${x.rank}.</b> ${esc(x.diagnosis||'')} ${x.icd10?'<span style="color:var(--text-muted)">('+esc(x.icd10)+')</span>':''}</div>`)}
  if(rec)h+='<h3>建议</h3><p>'+esc(rec)+'</p>';pv.innerHTML=h
}

// ==================== Save / Send ====================
function buildReport(){
  return {study_see:document.getElementById('studySeeEdit').value.trim(),study_hint:(S.report?.study_hint||[]).filter(h=>!S.dels.has(h.id)).map(h=>({rank:h.rank,diagnosis:h.diagnosis,icd10:h.icd10})),recommendation:document.getElementById('rec').textContent.trim()}
}
async function doSave(){
  if(!S.sel){toast('请先选择患者','error');return}
  const rpt={...S.report,...buildReport()};
  const r=await fetch('/api/reports/'+(S.report?S.sel.id:0)+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:rpt})}).catch(()=>null);
  const key='rpt_'+S.sel.id;localStorage[key]=JSON.stringify(buildReport());
  toast('报告已保存草稿，可继续修改','success');
}
async function doSend(){
  if(!S.sel){toast('请先选择患者','error');return}if(!confirm('确认发送至PACS？发送后不可修改。'))return;
  await doSave();
  const rpt={...S.report,...buildReport()};
  await fetch('/api/reports/'+(S.report?S.sel.id:0)+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:rpt})}).catch(()=>{});
  markDone();toast('已发送至PACS','success');document.getElementById('sendBtn').disabled=true;document.getElementById('saveBtn').disabled=true
}

// ==================== UI ====================
function toggleP(id){document.getElementById(id).classList.toggle('collapsed')}
function esc(s){return s!=null?String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]):''}
function toast(m,t){const c=document.getElementById('tc');const d=document.createElement('div');d.className='toast '+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),3500)}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='r'){e.preventDefault();toggleRec()}if(e.ctrlKey&&e.key==='s'){e.preventDefault();doSave()}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doSend()}if(e.key==='Escape'){e.preventDefault();if(S.sel)resetWs()}})
loadQueue();
</script>
</body>
</html>
